<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Financiación · Caudal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#7B2CBF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css?v=10">
<script>(function(){var s=localStorage.getItem("mf-theme");document.documentElement.dataset.theme=s?s:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");})();</script>
<style>
    body { padding-bottom: 26px; background: var(--paper); }
    .alerta { border-left: 3px solid var(--neg); }
    .alerta-soon { border-left: 3px solid #C99A3B; }
</style>
</head>
<body>

<div id="boot" class="fixed inset-0 grid place-items-center" style="background:var(--paper);z-index:90">
    <div class="wrap w-full" style="max-width:420px">
        <div class="skel h-4 w-32 mb-4"></div><div class="skel h-24 w-full mb-3"></div><div class="skel h-16 w-full"></div>

<!-- Red de seguridad: script clásico, corre aunque el módulo falle al cargar. -->
<script>
(function () {
    var mostrado = false;
    function caer(detalle) {
        if (mostrado) return;
        var b = document.getElementById('boot');
        if (!b || b.classList.contains('hidden')) return;
        mostrado = true;
        b.innerHTML =
            '<div style="max-width:340px;padding:24px;text-align:center">' +
            '<p style="font-size:17px;font-weight:600;margin-bottom:8px">No se pudo cargar la página</p>' +
            '<p style="font-size:13.5px;line-height:1.6;color:#878D98;margin-bottom:18px">' +
            'Revisá tu conexión y volvé a intentar. Si sigue igual, cerrá la aplicación y abrila de nuevo.</p>' +
            '<button onclick="location.reload()" style="padding:10px 20px;border-radius:7px;border:0;' +
            'background:#C41E30;color:#fff;font-weight:600;font-size:14px;cursor:pointer">Reintentar</button>' +
            '<p style="font-size:11px;color:#878D98;margin-top:16px;word-break:break-word;font-family:monospace">' +
            String(detalle || '').slice(0, 160) + '</p></div>';
    }
    window.addEventListener('error', function (e) {
        caer(e.message || (e.target && e.target.src) || 'error');
    }, true);
    window.addEventListener('unhandledrejection', function (e) { caer(e.reason); });
    setTimeout(function () { caer('La carga tardó demasiado'); }, 15000);
})();
</script>
    </div>
</div>

<div id="app" class="hidden">
    <div id="shell"></div>
    <div class="greet">
        <div class="wrap greet-in">
            <span class="greet-ico" id="greet-ico"></span>
            <div class="flex-1 min-w-0">
                <p class="text-[16px] font-semibold truncate" id="greet-text">Hola</p>
                <p class="text-[12px]" style="color:var(--ink-3)">Artículos financiados y sus cuotas</p>
            </div>
        </div>
    </div>
    <button class="fab" data-act="agregar">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Agregar deuda
    </button>
    <main class="wrap py-5">
        <section id="v-list"></section>
        <section id="v-detail" class="hidden"></section>
    </main>
</div>

<script type="module">
import { db, COL, collection, doc, addDoc, onSnapshot, updateDoc, deleteDoc, query,
         $, esc, uid, money, money0, monogram, tint, flong, fmid, todayStr, isoToDate, dateToISO,
         cuotaDue, diasEntre, MESES, notice, openDialog, closeDialog, askConfirm, num, dialogFooter,
         bootShell, mountShell, saludo, swapView, countUp, leer, guardar,
         rondaInfo, ESTADO_RONDA } from './core.js?v=10';

let items = [], rondas = [], personales = [], route = { view: 'list', id: null };
const AVISO_DIAS = 5;   // cuántos días antes empieza el recordatorio

/* ---------------- Cálculos ---------------- */
const pagadas   = (it) => Array.isArray(it?.paid) ? it.paid : [];
const estaPagada = (it, n) => pagadas(it).some(p => Number(p.n) === n);
const nCuotas   = (it) => Number(it.installments) || 1;
const montoCuota = (it) => Number(it.installmentAmount) || (Number(it.total) || 0) / nCuotas(it);
const pagado    = (it) => pagadas(it).reduce((a, p) => a + Number(p.amount || montoCuota(it)), 0);
const restante  = (it) => Math.max(0, (Number(it.total) || 0) - pagado(it));
const terminado = (it) => pagadas(it).length >= nCuotas(it);

/** Próxima cuota sin pagar, con su estado. */
function proxima(it) {
    for (let n = 1; n <= nCuotas(it); n++) {
        if (estaPagada(it, n)) continue;
        const due = cuotaDue(it, n);
        const dias = diasEntre(new Date(), due);
        return { n, due, dias, estado: dias < 0 ? 'late' : dias <= AVISO_DIAS ? 'soon' : 'ok' };
    }
    return null;
}
function estadoCuota(it, n) {
    if (estaPagada(it, n)) return 'paid';
    const dias = diasEntre(new Date(), cuotaDue(it, n));
    return dias < 0 ? 'late' : dias <= AVISO_DIAS ? 'soon' : 'pend';
}
const activos = () => items.filter(i => !terminado(i));

/* Las rondas que ya cobraron el bote son deuda. No se copian aquí:
   se leen de la colección de rondas y se muestran derivadas, así que
   marcar una semana desde esta página actualiza la misma ronda. */
function deudasRonda() {
    return rondas.map(r => ({ r, i: rondaInfo(r) }))
                 .filter(x => x.i.estado === 'pagando' && x.i.pendientes > 0)
                 .sort((a, b) => (a.i.prox?.dias ?? 999) - (b.i.prox?.dias ?? 999));
}
const deudaRondas  = () => deudasRonda().reduce((a, x) => a + x.i.deuda, 0);
const cuotaRondas  = () => deudasRonda().reduce((a, x) => a + x.i.cuota * 4.33, 0);   // semanal -> mensual

/* ---------------- Deudas personales ----------------
   Plata que le debo a un familiar o conocido. A diferencia de una compra
   en cuotas, no tiene número fijo de pagos ni día de corte: se abona lo
   que se puede, cuando se puede. Por eso el modelo es abierto. */
const abonosDe   = (d) => Array.isArray(d?.payments) ? d.payments : [];
const abonado    = (d) => abonosDe(d).reduce((a, p) => a + (Number(p.amount) || 0), 0);
const montoDe    = (d) => Number(d?.amount) || 0;
const restaDe    = (d) => Math.max(0, montoDe(d) - abonado(d));
const saldada    = (d) => restaDe(d) <= 0.005;
const persActivas = () => personales.filter(d => !saldada(d));
const deudaPersonal = () => persActivas().reduce((a, d) => a + restaDe(d), 0);

/** Días para la fecha acordada. null si no se pactó ninguna. */
function plazoDe(d) {
    if (!d?.dueDate) return null;
    const dias = diasEntre(new Date(), new Date(d.dueDate + 'T12:00:00'));
    return { dias, estado: dias < 0 ? 'late' : dias <= AVISO_DIAS ? 'soon' : 'ok' };
}

const deudaTotal = () => activos().reduce((a, i) => a + restante(i), 0) + deudaRondas() + deudaPersonal();
const cuotaMensual = () => activos().reduce((a, i) => a + montoCuota(i), 0) + cuotaRondas();

/** Cuotas vencidas o por vencer, ordenadas por urgencia. */
function alertas() {
    const deItems = activos().map(it => ({ it, p: proxima(it) })).filter(x => x.p && x.p.estado !== 'ok');
    const deRondas = deudasRonda().filter(x => x.i.prox && x.i.prox.estado !== 'ok')
        .map(x => ({ ronda: x.r, i: x.i, p: { n: x.i.prox.n, due: new Date(x.i.prox.date + 'T12:00:00'),
                     dias: x.i.prox.dias, estado: x.i.prox.estado } }));
    return [...deItems, ...deRondas].sort((a, b) => a.p.dias - b.p.dias);
}

function alertasPersonales() {
    return persActivas().map(d => ({ d, pl: plazoDe(d) }))
        .filter(x => x.pl && x.pl.estado !== 'ok')
        .sort((a, b) => a.pl.dias - b.pl.dias);
}

const textoDias = (d) => d < 0 ? `vencida hace ${Math.abs(d)} día${Math.abs(d) === 1 ? '' : 's'}`
                       : d === 0 ? 'vence hoy' : d === 1 ? 'vence mañana' : `en ${d} días`;

/* ---------------- Navegación ---------------- */
function go(view, id = null, push = true) {
    route = { view, id };
    if (push) history.pushState({ view, id }, '');
    $('#v-list').classList.toggle('hidden', view !== 'list');
    $('#v-detail').classList.toggle('hidden', view === 'list');
    window.scrollTo(0, 0);
    render();
}
window.addEventListener('popstate', (e) => {
    if (document.querySelector('#dialog.open')) return;
    const s = e.state || { view: 'list' };
    go(s.view || 'list', s.id || null, false);
});
const render = () => route.view === 'list' ? renderList() : renderDetail();

/* ---------------- Lista ---------------- */
function renderList() {
    const al = alertas();
    const act = activos();
    const fin = items.filter(terminado);
    const dr  = deudasRonda();
    const pa  = persActivas();
    const ps  = personales.filter(saldada);
    const alPers = alertasPersonales();

    swapView($('#v-list'), `
        ${al.length ? `
        <div>
            <p class="sec-title">Requiere tu atención</p>
            <section class="gcard">
                ${al.map((a) => {
                    const esRonda = !!a.ronda;
                    const nombre  = esRonda ? a.i.nombre : a.it.name;
                    const sub     = esRonda ? `Semana ${a.p.n} de ${a.i.n} · ronda` : `Cuota ${a.p.n} de ${nCuotas(a.it)} · ${fmid(a.p.due.toISOString())}`;
                    const monto   = esRonda ? a.i.cuota : montoCuota(a.it);
                    const accion  = esRonda ? `data-act="abrir-ronda" data-id="${a.ronda.id}"` : `data-act="abrir" data-id="${a.it.id}"`;
                    return `
                    <button class="grow ${a.p.estado === 'late' ? 'alerta' : 'alerta-soon'}" ${accion}>
                        <span class="mono-tile" style="background:${a.p.estado === 'late' ? 'var(--neg-soft)' : '#FFF4E0'};color:${a.p.estado === 'late' ? 'var(--neg)' : '#8A5A1E'}">
                            <span class="dot-pulse"></span>
                        </span>
                        <span class="flex-1 min-w-0">
                            <span class="block text-[15px] font-semibold truncate">${esc(nombre)}</span>
                            <span class="block text-[12px] mt-0.5" style="color:var(--ink-3)">${sub}</span>
                            <span class="st ${a.p.estado === 'late' ? 'st-late' : 'st-soon'} mt-1.5">${textoDias(a.p.dias)}</span>
                        </span>
                        <span class="text-right">
                            <span class="num block text-[15.5px]">${money(monto)}</span>
                            <span class="cur block">HNL</span>
                        </span>
                    </button>`;
                }).join('')}
            </section>
        </div>` : ''}

        <div>
            <p class="sec-title">Resumen</p>
            <section class="gcard">
                <div class="px-4 pt-4 pb-4">
                    <p class="tag">Me falta pagar</p>
                    <p class="num text-[32px] leading-none mt-2" id="hero">L 0.00</p>
                    <p class="text-[12px] mt-2" style="color:var(--ink-3)">
                        ${act.length || dr.length
                          ? `${act.length ? `${act.length} artículo${act.length === 1 ? '' : 's'}` : ''}${act.length && dr.length ? ' y ' : ''}${dr.length ? `${dr.length} ronda${dr.length === 1 ? '' : 's'}` : ''} en pago${al.length ? '' : ' · todo al día'}`
                          : 'No debes cuotas'}
                    </p>
                </div>
                <div class="kpi">
                    <div><p class="tag">Cuota mensual</p><p class="num text-[14.5px] mt-1.5">${money(cuotaMensual())}</p></div>
                    <div><p class="tag">Artículos</p><p class="num text-[14.5px] mt-1.5">${act.length}</p></div>
                    <div><p class="tag">Personales</p><p class="num text-[14.5px] mt-1.5">${pa.length}</p></div>
                </div>
            </section>
        </div>

        <div>
            <p class="sec-title">En pago</p>
            ${act.length ? act.map(fila).join('') : `
            <section class="gcard"><div class="px-4 py-5">
                <h2 class="text-[16px] font-semibold mb-2">Registra un artículo financiado</h2>
                <p class="text-[13.5px] mb-4" style="color:var(--ink-2);line-height:1.6">
                    Anotas qué compraste, en cuántas cuotas y qué día del mes se paga. La aplicación te avisa
                    ${AVISO_DIAS} días antes de cada vencimiento y marca en rojo lo que se te pasó.</p>
                <button class="btn btn-primary" data-act="nuevo">Agregar artículo</button>
            </div></section>`}
        </div>

        ${dr.length ? `<div>
            <p class="sec-title">Cuotas de rondas</p>
            <section class="gcard">
                ${dr.map(({ r, i }) => `
                <button class="grow" data-act="abrir-ronda" data-id="${r.id}">
                    <span class="mono-tile" style="background:var(--neg-soft);color:var(--neg)">${esc(monogram(i.nombre))}</span>
                    <span class="flex-1 min-w-0">
                        <span class="flex items-center gap-2 mb-1">
                            <span class="text-[15px] font-semibold truncate">${esc(i.nombre)}</span>
                            <span class="badge" style="background:var(--neg-soft);color:var(--neg);border-color:transparent">Ronda</span>
                        </span>
                        <span class="block text-[12px] mb-1.5" style="color:var(--ink-3)">
                            Faltan ${i.pendientes} de ${i.n} semanas · ${money0(i.cuota)} cada una
                        </span>
                        <span class="meter block" style="max-width:200px"><i style="width:${i.progreso}%;background:var(--neg)"></i></span>
                    </span>
                    <span class="text-right">
                        <span class="num block text-[15.5px] neg">${money(i.deuda)}</span>
                        <span class="cur block">HNL</span>
                    </span>
                    <svg class="grow-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
                </button>`).join('')}
                <div class="gfoot">
                    <p class="text-[12.5px]" style="color:var(--ink-2);line-height:1.6">
                        Aparecen aquí porque ya cobraste el bote: lo que falta por aportar es deuda.
                        Se administran desde Rondas y los cambios se ven en las dos páginas.
                    </p>
                </div>
            </section>
        </div>` : ''}

        <div>
            <div class="flex items-center justify-between">
                <p class="sec-title">Deudas personales</p>
                <button class="text-[13px] font-extrabold mb-2.5" data-act="nuevo-personal" style="color:var(--brand-text)">+ Agregar</button>
            </div>
            ${pa.length ? pa.map(filaPersonal).join('') : `
            <section class="gcard"><div class="px-5 py-6 text-center">
                <p class="text-[14px] font-bold mb-1">Sin deudas personales</p>
                <p class="text-[13px]" style="color:var(--ink-3);line-height:1.6">
                    Lo que le debés a un familiar o conocido. Sin cuotas fijas: abonás lo que podés, cuando podés.
                </p>
            </div></section>`}
        </div>

        ${ps.length ? `<div>
            <p class="sec-title">Deudas personales saldadas</p>
            ${ps.map(filaPersonal).join('')}
        </div>` : ''}

        ${fin.length ? `<div>
            <p class="sec-title">Terminados</p>
            ${fin.map(fila).join('')}
        </div>` : ''}
    `);
    countUp($('#hero'), deudaTotal());
}

function fila(it) {
    const p = proxima(it), pct = (pagadas(it).length / nCuotas(it)) * 100;
    const listo = terminado(it);
    const urgente = p && p.estado !== 'ok';
    return `<div class="gcard" style="margin-bottom:12px">
        <div class="px-4 pt-4 pb-4">
            <div class="flex items-start gap-3 mb-3">
                <span class="mono-tile" style="background:${listo ? 'var(--pos-soft)' : 'var(--brand-soft)'};color:${listo ? 'var(--pos)' : 'var(--brand-text)'}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 14.5h4"/></svg>
                </span>
                <span class="flex-1 min-w-0">
                    <span class="block text-[16px] font-extrabold truncate">${esc(it.name)}</span>
                    <span class="block text-[13px] mt-0.5" style="color:var(--ink-3)">Cuota ${money(montoCuota(it))}</span>
                </span>
                <button class="btn btn-quiet btn-sm flex-none" style="padding:6px 8px" data-act="abrir" data-id="${it.id}" aria-label="Ver detalle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg>
                </button>
            </div>

            <div class="flex justify-between items-baseline text-[13px] mb-2" style="color:var(--ink-2)">
                <span>Pagado: <b class="num" style="color:var(--ink)">${money(pagado(it))}</b></span>
                <span>Queda: <b class="num" style="color:${listo ? 'var(--pos)' : 'var(--ink)'}">${money(restante(it))}</b></span>
            </div>
            <div class="meter mb-3"><i style="width:${pct}%;${listo ? 'background:var(--pos)' : ''}"></i></div>

            ${p ? `
            <div class="flex items-center gap-2 mb-1">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${p.estado === 'late' ? 'var(--neg)' : p.estado === 'soon' ? 'var(--warn)' : 'var(--brand-text)'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
                <span class="text-[13.5px] font-bold" style="color:${p.estado === 'late' ? 'var(--neg)' : p.estado === 'soon' ? 'var(--warn)' : 'var(--brand-text)'}">
                    Próximo pago: ${fmid(p.due.toISOString())}
                </span>
                <span class="text-[12.5px] ml-auto font-bold" style="color:${p.estado === 'late' ? 'var(--neg)' : 'var(--ink-3)'}">${textoDias(p.dias)}</span>
            </div>` : ''}
            <p class="text-[12px] mb-3" style="color:var(--ink-3)">
                ${esc(it.method || 'Financiado')} · ${pagadas(it).length} de ${nCuotas(it)} cuotas pagadas
            </p>

            ${listo ? `<span class="st st-ok">Pagado por completo</span>` : `
            <div class="flex gap-2.5">
                <button class="btn btn-outline flex-1" data-act="abrir" data-id="${it.id}">Ver cuotas</button>
                ${p ? `<button class="btn btn-primary flex-1" data-act="pagar" data-id="${it.id}" data-n="${p.n}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
                    Pagar cuota
                </button>` : ''}
            </div>`}
        </div>
    </div>`;
}

/** Tarjeta de una deuda personal. */
function filaPersonal(d) {
    const resta = restaDe(d), total = montoDe(d), ab = abonado(d);
    const pct = total > 0 ? (ab / total) * 100 : 0;
    const listo = saldada(d);
    const pl = plazoDe(d);
    return `<div class="gcard" style="margin-bottom:12px">
        <div class="px-4 pt-4 pb-4">
            <div class="flex items-start gap-3 mb-3">
                <span class="mono-tile" style="background:${listo ? 'var(--pos-soft)' : tint(d.person).bg};color:${listo ? 'var(--pos)' : tint(d.person).fg}">
                    ${monogram(d.person)}
                </span>
                <span class="flex-1 min-w-0">
                    <span class="block text-[16px] font-extrabold truncate">${esc(d.person)}</span>
                    <span class="block text-[13px] mt-0.5" style="color:var(--ink-3)">
                        ${d.concept ? esc(d.concept) : `Desde el ${fmid((d.date || d.createdAt))}`}
                    </span>
                </span>
                <button class="btn btn-quiet btn-sm flex-none" style="padding:6px 8px" data-act="abrir-personal" data-id="${d.id}" aria-label="Ver detalle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg>
                </button>
            </div>

            <div class="flex justify-between items-baseline text-[13px] mb-2" style="color:var(--ink-2)">
                <span>Abonado: <b class="num" style="color:var(--ink)">${money(ab)}</b></span>
                <span>${listo ? 'Saldada' : 'Debo'}: <b class="num" style="color:${listo ? 'var(--pos)' : 'var(--neg)'}">${money(resta)}</b></span>
            </div>
            <div class="meter mb-3"><i style="width:${pct}%;${listo ? 'background:var(--pos)' : ''}"></i></div>

            ${pl && !listo ? `
            <div class="flex items-center gap-2 mb-3">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${pl.estado === 'late' ? 'var(--neg)' : pl.estado === 'soon' ? 'var(--warn)' : 'var(--brand-text)'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
                <span class="text-[13.5px] font-bold" style="color:${pl.estado === 'late' ? 'var(--neg)' : pl.estado === 'soon' ? 'var(--warn)' : 'var(--brand-text)'}">
                    Acordado: ${fmid(d.dueDate + 'T12:00:00')}
                </span>

async function guardarPersonal(id = null) {
    const person = ($('#dPersona').value || '').trim();
    const monto  = num('#dMonto');
    if (!person)    return notice('Escribí a quién le debés', 'neg');
    if (monto <= 0) return notice('El monto debe ser mayor que cero', 'neg');

    const datos = {
        person,
        concept: ($('#dConcepto').value || '').trim(),
        amount: monto,
        date: $('#dFecha').value || todayStr(),
        dueDate: $('#dPlazo').value || ''
    };
    try {
        if (id) {
            await updateDoc(doc(db, COL.personales, id), datos);
            notice('Deuda actualizada');
        } else {
            await addDoc(collection(db, COL.personales), { ...datos, payments: [], createdAt: new Date().toISOString() });
            notice('Deuda agregada', 'pos');
        }
        closeDialog();
    } catch (e) { notice('No se pudo guardar', 'neg'); console.error(e); }
}

/** Registrar un abono. Sugiere el saldo completo como atajo. */
function dialogAbono(d) {
    const resta = restaDe(d);
    openDialog(`
        <h2 class="text-[19px] font-extrabold mb-1">Abonar a ${esc(d.person)}</h2>
        <p class="text-[13.5px] mb-5" style="color:var(--ink-3)">Te falta pagar <span class="num" style="color:var(--ink)">${money(resta)}</span>.</p>
        <div class="space-y-4">
            <div><label class="label" for="aMonto">¿Cuánto abonás?</label>
                <input id="aMonto" class="field field-num" type="number" step="0.01" inputmode="decimal" placeholder="0.00">
                <div class="flex gap-2 mt-2.5 flex-wrap">
                    ${[100, 500, 1000].filter(v => v < resta).map(v => `<button type="button" class="chip btn-sm" data-act="a-set" data-v="${v}">${money0(v)}</button>`).join('')}
                    <button type="button" class="chip btn-sm" data-act="a-set" data-v="${resta}">Todo (${money0(resta)})</button>
                </div></div>
            <div class="split split-2">
                <div><label class="label" for="aFecha">Fecha</label>
                    <input id="aFecha" class="field" type="date" value="${todayStr()}"></div>
                <div><label class="label" for="aNota">Nota <span class="hint">— opcional</span></label>
                    <input id="aNota" class="field" maxlength="40" placeholder="Efectivo, transferencia..."></div>
            </div>
        </div>
        ${dialogFooter('save-abono', 'Registrar abono', d.id)}`);
    setTimeout(() => $('#aMonto')?.focus(), 80);
}

async function guardarAbono(id) {
    const d = personales.find(x => x.id === id);
    if (!d) return;
    const monto = num('#aMonto');
    if (monto <= 0) return notice('El abono debe ser mayor que cero', 'neg');

    const resta = restaDe(d);
    if (monto > resta + 0.005) {
        const sigue = await askConfirm({
            titulo: 'Abono mayor a lo que debés',
            texto: `Le debés ${money(resta)} pero vas a abonar ${money(monto)}. ¿Lo registro igual?`,
            ok: 'Sí, registrar'
        });
        if (!sigue) return;
    }
    const abono = {
        id: uid(), amount: monto,
        date: $('#aFecha').value || todayStr(),
        note: ($('#aNota').value || '').trim()
    };
    try {
        await updateDoc(doc(db, COL.personales, id), { payments: [...abonosDe(d), abono] });
        closeDialog();
        const queda = Math.max(0, resta - monto);
        notice(queda <= 0.005 ? `¡Saldaste con ${d.person}!` : `Abonado · quedan ${money(queda)}`, 'pos');
    } catch (e) { notice('No se pudo registrar', 'neg'); console.error(e); }
}

async function borrarAbono(id, pid) {
    const d = personales.find(x => x.id === id);
    if (!d) return;
    const sigue = await askConfirm({ titulo: '¿Quitar este abono?', texto: 'El saldo va a subir de nuevo.', ok: 'Quitar', peligro: true });
    if (!sigue) return;
    try {
        await updateDoc(doc(db, COL.personales, id), { payments: abonosDe(d).filter(p => p.id !== pid) });
        notice('Abono quitado');
    } catch (e) { notice('No se pudo quitar', 'neg'); console.error(e); }
}

async function borrarPersonal(id) {
    const d = personales.find(x => x.id === id);
    if (!d) return;
    const sigue = await askConfirm({
        titulo: `¿Eliminar la deuda con ${d.person}?`,
        texto: 'Se borra el registro y todos sus abonos. No se puede deshacer.',
        ok: 'Eliminar', peligro: true
    });
    if (!sigue) return;
    try { await deleteDoc(doc(db, COL.personales, id)); go('list'); notice('Deuda eliminada'); }
    catch (e) { notice('No se pudo eliminar', 'neg'); console.error(e); }
}

    </div>`);
    const upd = () => {
        const t = num('#iTotal'), n = Math.max(1, parseInt($('#iN').value) || 1);
        $('#iPreview').textContent = money(t / n);
    };
    ['#iTotal', '#iN'].forEach(s => $(s).addEventListener('input', upd));
    $('#iDay').addEventListener('input', () => {
        const d = new Date($('#iFirst').value + 'T12:00:00');
        const day = Math.min(31, Math.max(1, parseInt($('#iDay').value) || 1));
        const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        d.setDate(Math.min(day, ult));
        $('#iFirst').value = isoToDate(d.toISOString());
    });
    upd();
}

/* ---------------- Escrituras ---------------- */
function leerForm() {
    const name = ($('#iName').value || '').trim();
    const total = num('#iTotal');
    const n = Math.max(1, parseInt($('#iN').value) || 1);
    const dueDay = Math.min(31, Math.max(1, parseInt($('#iDay').value) || 1));
    const firstDue = $('#iFirst').value;
    if (!name)  { notice('Escribe qué compraste', 'neg'); return null; }
    if (total <= 0) { notice('Escribe el total a pagar', 'neg'); return null; }
    if (!firstDue)  { notice('Elige la fecha de la primera cuota', 'neg'); return null; }
    return { name, store: ($('#iStore').value || '').trim(), method: $('#iMethod').value,
             total, installments: n, installmentAmount: total / n, dueDay, firstDue };
}

async function crear() {
    const d = leerForm();
    if (!d) return;
    try {
        const ref = await addDoc(collection(db, COL.financiado), { ...d, createdAt: new Date().toISOString(), paid: [] });
        closeDialog(); notice('Artículo agregado', 'pos'); go('detail', ref.id);
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function editar(id) {
    const d = leerForm();
    if (!d) return;
    try { await updateDoc(doc(db, COL.financiado, id), d); closeDialog(); notice('Actualizado'); }
    catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function marcar(id, n) {
    const it = items.find(x => x.id === id);
    n = Number(n);
    const ya = estaPagada(it, n);
    let lista;
    if (ya) lista = pagadas(it).filter(p => Number(p.n) !== n);
    else    lista = [...pagadas(it), { n, amount: montoCuota(it), date: new Date().toISOString() }];
    try {
        await updateDoc(doc(db, COL.financiado, id), { paid: lista });
        if (!ya) {
            const quedan = nCuotas(it) - lista.length;
            notice(quedan === 0 ? '¡Artículo pagado por completo!' : `Cuota ${n} pagada · quedan ${quedan}`, 'pos');
        } else notice(`Cuota ${n} desmarcada`);
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

/** Marca pagada una semana de ronda. Escribe en la misma colección de
    rondas, así que el cambio se ve igual en las dos páginas. */
async function pagarSemana(rondaId, idx) {
    const r = rondas.find(x => x.id === rondaId);
    if (!r) return;
    const w = [...(r.weeks || [])];
    if (!w[idx] || w[idx].status === 'paid') return;
    w[idx] = { ...w[idx], status: 'paid' };
    try {
        await updateDoc(doc(db, COL.rondas, rondaId), { weeks: w });
        const i = rondaInfo({ ...r, weeks: w });
        notice(i.pendientes === 0 ? '¡Ronda completada!' : `Semana pagada · faltan ${i.pendientes}`, 'pos');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function borrar(id) {
    const it = items.find(x => x.id === id);
    const ok = await askConfirm({ title: 'Eliminar artículo', danger: true, key: true, label: 'Eliminar',
        body: `Se borra <b>${esc(it.name)}</b> con el registro de sus ${pagadas(it).length} cuota${pagadas(it).length === 1 ? '' : 's'} pagada${pagadas(it).length === 1 ? '' : 's'}. No se puede deshacer.` });
    if (!ok) return;
    try { await deleteDoc(doc(db, COL.financiado, id)); go('list'); notice('Artículo eliminado'); }
    catch (e) { notice('No se pudo eliminar: ' + e.message, 'neg'); }
}

/* ---------------- Recordatorio al abrir ---------------- */
function avisarHoy() {
    const al = alertas();
    if (!al.length) return;
    const hoy = todayStr();
    const visto = leer('mf-aviso-fin', {});
    const clave = (x) => `${x.ronda ? 'r:' + x.ronda.id : x.it.id}-${x.p.n}`;
    const nuevos = al.filter(x => visto[clave(x)] !== hoy);
    if (!nuevos.length) return;
    nuevos.forEach(x => visto[clave(x)] = hoy);
    guardar('mf-aviso-fin', visto);

    const vencidas = nuevos.filter(x => x.p.estado === 'late');
    const l = nuevos[0];
    const esRonda = !!l.ronda;
    openDialog(`
    <div class="py-1">
        <p class="st ${vencidas.length ? 'st-late' : 'st-soon'} mb-3">${vencidas.length ? 'Tienes pagos vencidos' : 'Se acerca un pago'}</p>
        <h2 class="text-[18px] font-semibold mb-1.5">${esc(esRonda ? l.i.nombre : l.it.name)}</h2>
        <p class="text-[14px] mb-4" style="color:var(--ink-2);line-height:1.6">
            ${esRonda ? `Semana ${l.p.n} de ${l.i.n}` : `Cuota ${l.p.n} de ${nCuotas(l.it)}`}
            por <span class="num font-semibold">${money(esRonda ? l.i.cuota : montoCuota(l.it))}</span>,
            ${textoDias(l.p.dias)} (${flong(l.p.due.toISOString())}).
        </p>
        ${nuevos.length > 1 ? `<p class="text-[13px] mb-4" style="color:var(--ink-3)">Y ${nuevos.length - 1} pago${nuevos.length > 2 ? 's' : ''} más pendiente${nuevos.length > 2 ? 's' : ''}.</p>` : ''}
        <div class="flex gap-2.5">
            <button class="btn btn-outline flex-1" data-act="close-dialog">Después</button>
            ${esRonda
              ? `<button class="btn btn-primary flex-1" data-act="pagar-semana" data-id="${l.ronda.id}" data-n="${l.p.n - 1}">Ya la pagué</button>`
              : `<button class="btn btn-primary flex-1" data-act="pagar" data-id="${l.it.id}" data-n="${l.p.n}">Ya la pagué</button>`}
        </div>
    </div>`);
}

/* ---------------- Eventos ---------------- */
document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const { act, id, n, pid, v } = el.dataset;
    switch (act) {
        case 'nuevo':  dlgItem(); break;
        case 'agregar': dialogElegirTipo(); break;

        /* Deudas personales */
        case 'nuevo-personal':    dialogPersonal(); break;
        case 'abrir-personal':    closeDialog(); go('detail-personal', id); break;
        case 'editar-personal':   dialogPersonal(personales.find(x => x.id === id)); break;
        case 'borrar-personal':   borrarPersonal(id); break;
        case 'abonar':            dialogAbono(personales.find(x => x.id === id)); break;
        case 'save-personal-new':  guardarPersonal(); break;
        case 'save-personal-edit': guardarPersonal(id); break;
        case 'save-abono':        guardarAbono(id); break;
        case 'borrar-abono':      borrarAbono(id, pid); break;
        case 'a-set':             $('#aMonto').value = v; $('#aMonto').focus(); break;
        case 'abrir':  closeDialog(); go('detail', id); break;
        case 'volver': go('list'); break;
        case 'editar': dlgItem(id); break;
        case 'borrar': borrar(id); break;
        case 'toggle': marcar(id, n); break;
        case 'pagar':  closeDialog(); marcar(id, n); break;
        case 'save-new':  crear(); break;
        case 'save-edit': editar(id); break;
        case 'abrir-ronda':   closeDialog(); location.href = 'ronda.html'; break;
        case 'pagar-semana':  closeDialog(); pagarSemana(id, Number(n)); break;
    }
});

/* ---------------- Arranque ---------------- */
mountShell('Deudas', 'deudas');
let listo = false, avisado = false;
function mostrar() {
    if (listo) return;
    listo = true;
    $('#boot').classList.add('hidden');
    $('#app').classList.remove('hidden');
    saludo();
    history.replaceState({ view: 'list', id: null }, '');
    render();
    setTimeout(() => { if (!avisado) { avisado = true; avisarHoy(); } }, 700);
}
bootShell({ onReady: () => {
    let faltan = 3;   // financiado, rondas, personales
    const listoUno = () => { if (--faltan <= 0) mostrar(); };
    onSnapshot(query(collection(db, COL.financiado)), (snap) => {
        items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        listoUno(); if (listo) render();
    }, (err) => { listoUno(); notice('Sin conexión con la nube', 'neg'); console.error(err); });
    onSnapshot(query(collection(db, COL.rondas)), (snap) => {
        rondas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        listoUno(); if (listo) render();
    }, (err) => { listoUno(); console.error(err); });
    onSnapshot(query(collection(db, COL.personales)), (snap) => {
        personales = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        listoUno(); if (listo) render();
    }, (err) => { listoUno(); console.error(err); });
    setTimeout(mostrar, 3000);
}});
</script>
