<!-- Red de seguridad: script clásico, corre aunque el módulo falle al cargar. -->
<script>
(function () {
    var mostrado = false;
    function caer(detalle) {
        if (mostrado) return;
        var b = document.getElementById('boot');
        if (!b || b.classList.contains('hidden')) return;
        mostrado = true;
        b.innerHTML =
            '<div style="max-width:340px;padding:24px;text-align:center">' +
            '<p style="font-size:17px;font-weight:600;margin-bottom:8px">No se pudo cargar la página</p>' +
            '<p style="font-size:13.5px;line-height:1.6;color:#878D98;margin-bottom:18px">' +
            'Revisá tu conexión y volvé a intentar. Si sigue igual, cerrá la aplicación y abrila de nuevo.</p>' +
            '<button onclick="location.reload()" style="padding:10px 20px;border-radius:7px;border:0;' +
            'background:#C41E30;color:#fff;font-weight:600;font-size:14px;cursor:pointer">Reintentar</button>' +
            '<p style="font-size:11px;color:#878D98;margin-top:16px;word-break:break-word;font-family:monospace">' +
            String(detalle || '').slice(0, 160) + '</p></div>';
    }
    window.addEventListener('error', function (e) {
        caer(e.message || (e.target && e.target.src) || 'error');
    }, true);
    window.addEventListener('unhandledrejection', function (e) { caer(e.reason); });
    setTimeout(function () { caer('La carga tardó demasiado'); }, 15000);
})();
</script>

/* ---------------- Capa de IA (opcional) ---------------- */
const KEY = 'mf-gemini-key';

/* ---- Gemini · Interactions API ----
   Un solo endpoint POST /v1beta/interactions. La respuesta no trae
   `candidates` sino `steps`: una línea de tiempo con el razonamiento y
   la salida. El texto final vive en los pasos `model_output`.
   El header Api-Revision fija el esquema y evita romperse si cambia. */
const GEMINI_URL      = 'https://generativelanguage.googleapis.com/v1beta/interactions';
const GEMINI_REVISION = '2026-05-20';
const GEMINI_MODEL    = 'gemini-3.7-flash';

/** Saca el texto final de una interacción: la última tanda seguida de
    pasos `model_output`, ignorando pensamiento y llamadas a herramientas. */
function textoDeInteraccion(data) {
    const steps = Array.isArray(data?.steps) ? data.steps : [];
    const finales = [];
    for (let i = steps.length - 1; i >= 0; i--) {
        if (steps[i]?.type !== 'model_output') break;
        finales.unshift(steps[i]);
    }
    const usar = finales.length ? finales : steps.filter(s => s?.type === 'model_output');
    return usar
        .flatMap(s => Array.isArray(s.content) ? s.content : [])
        .filter(c => c?.type === 'text' && typeof c.text === 'string')
        .map(c => c.text)
        .join('')
        .trim();
}

    </p>
    <div class="flex gap-2.5 justify-end">
        <button class="btn btn-outline" data-act="close-dialog">Cerrar</button>
        <button class="btn btn-primary" data-act="ia-run">Enviar y analizar</button>
    </div>`);
}

const mdHtml = (t) => '<p>' + esc(t).trim()
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>') + '</p>';

async function correrIA() {
    const key = localStorage.getItem(KEY);
    if (!key) return dlgLlave();
    closeDialog();

    const host = $('#ia-out') || (() => { render(); return $('#ia-out'); })();
    const caja = $('[data-act="ia"]')?.closest('.gcard')?.querySelector('.px-4');
    if (caja) caja.innerHTML = `<p class="ia-txt typing" id="ia-live">Analizando tus números</p>`;

    const prompt = `Eres un asesor financiero hondureño hablando con una persona real, no un cliente corporativo.
Analiza estos datos y escribe 3 o 4 párrafos cortos en español de Honduras, tono directo y cálido, sin tecnicismos ni listas.
Habla de "usted" no, usa "vos" o "tú" de forma natural. Menciona cifras concretas en Lempiras.
Sé honesto: si algo va mal, dilo claro; si va bien, reconócelo. No inventes datos que no estén aquí.
Si presta dinero a terceros, ten presente que ese capital no es efectivo disponible y que hay riesgo
de que no le paguen; el interés sí es ingreso real. Distingue entre lo que tiene a mano y lo que le deben.
Cierra con la única cosa más importante que debería hacer este mes.

Datos: ${JSON.stringify(resumenParaIA(R))}`;

    try {
        const res = await fetch(GEMINI_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-goog-api-key': key,
                'Api-Revision': GEMINI_REVISION
            },
            body: JSON.stringify({
                model: GEMINI_MODEL,
                input: prompt,
                /* Sin almacenamiento en los servidores de Google.
                   Por defecto las interacciones se guardan; aquí no hace
                   falta porque cada análisis es una sola pregunta. */
                store: false
            })
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(
                  res.status === 400 || res.status === 401 || res.status === 403 ? 'La llave no es válida o no tiene permiso'
                : res.status === 429 ? 'Se acabó la cuota gratis por hoy. Intentá mañana.'
                : res.status === 404 ? 'Tu llave todavía no tiene acceso al API de Gemini'
                : (err?.error?.message || `Error ${res.status}`));
        }
        const data = await res.json();
        if (data?.status === 'failed') throw new Error(data?.error?.message || 'Gemini no pudo completar el análisis');
        const txt = textoDeInteraccion(data);
        if (!txt) throw new Error('No devolvió texto');
        guardar('mf-ia-cache', {
            html: mdHtml(txt), fecha: new Date().toISOString(),
            score: R.total, modelo: data?.model || GEMINI_MODEL
        });
        render();
        notice('Análisis generado', 'pos');
    } catch (e) {
        notice(e.message, 'neg');
        render();
    }
}

/* ---------------- Eventos ---------------- */
document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    switch (el.dataset.act) {
        case 'ia':            localStorage.getItem(KEY) ? verLlave() : dlgLlave(); break;
        case 'ia-run':        correrIA(); break;
        case 'guardar-llave': {
            const v = ($('#gk').value || '').trim();
            if (!v) { notice('Pega tu llave', 'neg'); return; }
            localStorage.setItem(KEY, v); closeDialog(); verLlave();
            break;
        }
        case 'quitar-llave':
            localStorage.removeItem(KEY); localStorage.removeItem('mf-ia-cache');
            closeDialog(); render(); notice('Llave eliminada de este teléfono');
            break;
    }
});

/* ---------------- Arranque ---------------- */
mountShell('Análisis', null);
let listo = false;
function mostrar() {
    if (listo) return;
    listo = true;
    $('#boot').classList.add('hidden');
    $('#app').classList.remove('hidden');
    saludo(); render();
}
const suscribir = (col, campo) => onSnapshot(query(collection(db, col)), (s) => {
    D[campo] = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (--pendientes <= 0) mostrar();
    if (listo) render();
}, () => { if (--pendientes <= 0) mostrar(); });

bootShell({ onReady: () => {
    suscribir(COL.fondos, 'fondos');
    suscribir(COL.metas, 'metas');
    suscribir(COL.fiado, 'fiado');
    suscribir(COL.financiado, 'financiado');
    suscribir(COL.prestamos, 'prestamos');
    suscribir(COL.rondas, 'rondas');
    suscribir(COL.personales, 'personales');
    suscribir(COL.cripto, 'cripto');
    onSnapshot(doc(db, COL.presupuesto, 'main'), (s) => {
        D.presupuesto = s.exists() ? s.data() : {};
        if (--pendientes <= 0) mostrar();
        if (listo) render();
    }, () => { if (--pendientes <= 0) mostrar(); });
    setTimeout(mostrar, 3000);
}});
</script>
