<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rondas · Caudal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#7B2CBF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rondas">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css">
<script>(function(){var s=localStorage.getItem("mf-theme");document.documentElement.dataset.theme=s?s:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");})();</script>
<style></style>
</head>
<body>

<div id="boot" class="fixed inset-0 grid place-items-center" style="background:var(--paper);z-index:90">
    <div class="wrap w-full" style="max-width:420px">
        <div class="skel h-4 w-28 mb-4"></div><div class="skel h-24 w-full mb-3"></div><div class="skel h-16 w-full"></div>
    </div>
</div>

<!-- Red de seguridad: script clásico, corre aunque el módulo falle al cargar. -->
<script>
(function () {
    var mostrado = false;
    function caer(detalle) {
        if (mostrado) return;
        var b = document.getElementById('boot');
        if (!b || b.classList.contains('hidden')) return;
        mostrado = true;
        b.innerHTML =
            '<div style="max-width:340px;padding:24px;text-align:center">' +
            '<p style="font-size:17px;font-weight:600;margin-bottom:8px">No se pudo cargar la página</p>' +
            '<p style="font-size:13.5px;line-height:1.6;color:#878D98;margin-bottom:18px">' +
            'Revisá tu conexión y volvé a intentar. Si sigue igual, cerrá la aplicación y abrila de nuevo.</p>' +
            '<button onclick="location.reload()" style="padding:10px 20px;border-radius:7px;border:0;' +
            'background:#C41E30;color:#fff;font-weight:600;font-size:14px;cursor:pointer">Reintentar</button>' +
            '<p style="font-size:11px;color:#878D98;margin-top:16px;word-break:break-word;font-family:monospace">' +
            String(detalle || '').slice(0, 160) + '</p></div>';
    }
    window.addEventListener('error', function (e) { caer(e.message || (e.target && e.target.src) || 'error'); }, true);
    window.addEventListener('unhandledrejection', function (e) { caer(e.reason); });
    setTimeout(function () { caer('La carga tardó demasiado'); }, 15000);
})();
</script>

<div id="app" class="hidden">
    <div id="shell"></div>
    <div class="greet">
        <div class="wrap greet-in">
            <span class="greet-ico" id="greet-ico"></span>
            <div class="flex-1 min-w-0">
                <p class="text-[16px] font-semibold truncate" id="greet-text">Hola</p>
                <p class="text-[12px]" style="color:var(--ink-3)">Rondas de ahorro</p>
            </div>
        </div>
    </div>
    <main class="wrap py-5">
        <section id="v-list"></section>
        <section id="v-detail" class="hidden"></section>
    </main>
</div>

<script type="module">
import { db, COL, collection, doc, addDoc, onSnapshot, updateDoc, deleteDoc, query,
         $, esc, uid, money, money0, monogram, tint, flong, fmid, todayStr, isoToDate, diasEntre,
         notice, openDialog, closeDialog, askConfirm, num, dialogFooter, bootShell, mountShell,
         saludo, swapView, countUp, rondaInfo, rondaNeto, ESTADO_RONDA, shareSugerido, recordarShare } from './core.js';

let rondas = [], route = { view: 'list', id: null };

const info = (r) => rondaInfo(r);
const totales = () => rondas.reduce((a, r) => {
    const i = info(r);
    if (i.estado === 'ahorrando') a.ahorro += i.ahorrado;
    if (i.estado === 'pagando')   a.deuda  += i.deuda;
    return a;
}, { ahorro: 0, deuda: 0 });

const textoDias = (d) => d < 0 ? `atrasada ${Math.abs(d)} día${Math.abs(d) === 1 ? '' : 's'}`
                       : d === 0 ? 'toca hoy' : d === 1 ? 'toca mañana' : `en ${d} días`;

/* ---------------- Navegación ---------------- */
function go(view, id = null, push = true) {
    route = { view, id };
    if (push) history.pushState({ view, id }, '');
    $('#v-list').classList.toggle('hidden', view !== 'list');
    $('#v-detail').classList.toggle('hidden', view !== 'detail');
    window.scrollTo(0, 0);
    render();
}
window.addEventListener('popstate', (e) => {
    if (document.querySelector('#dialog.open')) return;
    const s = e.state || { view: 'list' };
    go(s.view || 'list', s.id || null, false);
});
const render = () => route.view === 'list' ? renderList() : renderDetail();

/* ---------------- Lista ---------------- */
function renderList() {
    const T = totales();
    const activas = rondas.filter(r => !info(r).terminada);
    const listas  = rondas.filter(r =>  info(r).terminada);
    const neto = T.ahorro - T.deuda;
    const urgentes = activas.map(r => ({ r, i: info(r) })).filter(x => x.i.prox && x.i.prox.estado !== 'ok')
                            .sort((a, b) => a.i.prox.dias - b.i.prox.dias);

    swapView($('#v-list'), `
        ${urgentes.length ? `
        <div>
            <p class="sec-title">Semanas por pagar</p>
            <section class="gcard">
                ${urgentes.slice(0, 3).map(({ r, i }) => `
                <button class="grow" data-act="abrir" data-id="${r.id}"
                        style="border-left:3px solid ${i.prox.estado === 'late' ? 'var(--neg)' : '#C99A3B'}">
                    <span class="mono-tile" style="background:${i.prox.estado === 'late' ? 'var(--neg-soft)' : '#FFF4E0'};color:${i.prox.estado === 'late' ? 'var(--neg)' : '#8A5A1E'}"><span class="dot-pulse"></span></span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-[14.5px] font-semibold truncate">${esc(i.nombre)}</span>
                        <span class="block text-[12px] mt-0.5" style="color:var(--ink-3)">Semana ${i.prox.n} de ${i.n} · ${textoDias(i.prox.dias)}</span>
                    </span>
                    <span class="num text-[15px]">${money(i.cuota)}</span>
                </button>`).join('')}
            </section>
        </div>` : ''}

        <div>
            <p class="sec-title">Mis rondas</p>
            <section class="gcard hero">
                <div class="px-4 pt-4 pb-4">
                    <p class="tag">Posición neta</p>
                    <p class="num text-[30px] leading-none mt-2 ${neto < 0 ? 'neg' : neto > 0 ? 'pos' : ''}" id="hero">L 0.00</p>
                    <p class="text-[12px] mt-2" style="color:var(--ink-3)">
                        ${T.ahorro > 0 && T.deuda > 0 ? 'Unas ahorrando y otras ya en pago'
                          : T.deuda > 0 ? 'Ya cobraste, ahora estás pagando'
                          : T.ahorro > 0 ? 'Aportando hacia tu turno' : 'Sin rondas activas'}
                    </p>
                    ${T.ahorro + T.deuda > 0 ? `
                    <div class="stack mt-4 mb-2.5">
                        ${T.ahorro > 0 ? `<i style="width:${(T.ahorro / (T.ahorro + T.deuda) * 100).toFixed(1)}%;background:var(--pos)"></i>` : ''}
                        ${T.deuda > 0 ? `<i style="width:${(T.deuda / (T.ahorro + T.deuda) * 100).toFixed(1)}%;background:var(--neg)"></i>` : ''}
                    </div>
                    <div class="legend">
                        ${T.ahorro > 0 ? `<span><i style="background:var(--pos)"></i>Ahorrado ${money0(T.ahorro)}</span>` : ''}
                        ${T.deuda > 0 ? `<span><i style="background:var(--neg)"></i>Debo ${money0(T.deuda)}</span>` : ''}
                    </div>` : ''}
                </div>
                <div class="kpi">
                    <div><p class="tag">Ahorrando</p><p class="num text-[14.5px] mt-1.5 pos">${money(T.ahorro)}</p></div>
                    <div><p class="tag">Debo</p><p class="num text-[14.5px] mt-1.5 ${T.deuda > 0 ? 'neg' : ''}">${money(T.deuda)}</p></div>
                    <div><p class="tag">Activas</p><p class="num text-[14.5px] mt-1.5">${activas.length}</p></div>
                </div>
            </section>
        </div>

        <div>
            <div class="flex items-center justify-between">
                <p class="sec-title">En curso</p>
                <button class="text-[13px] font-semibold mb-2" data-act="nueva" style="color:var(--brand-text)">+ Nueva ronda</button>
            </div>
            ${activas.length ? `<section class="gcard">${activas.map(fila).join('')}</section>` : `
            <section class="gcard"><div class="px-4 py-5">
                <h2 class="text-[16px] font-semibold mb-2">Registra tu ronda</h2>
                <p class="text-[13.5px] mb-4" style="color:var(--ink-2);line-height:1.6">
                    Antes de tu turno, lo que aportás cuenta como ahorro. Cuando te toca el bote, lo que falta
                    por aportar pasa a ser deuda y aparece en Financiación. Si pagás media cuota, lo configurás al crearla.</p>
                <button class="btn btn-primary" data-act="nueva">Crear ronda</button>
            </div></section>`}
        </div>

        ${listas.length ? `<div>
            <p class="sec-title">Terminadas</p>
            <section class="gcard">${listas.map(fila).join('')}</section>
        </div>` : ''}
    `);
    countUp($('#hero'), neto);
}

function fila(r) {
    const i = info(r), E = ESTADO_RONDA[i.estado];
    const valor = i.estado === 'pagando' ? i.deuda : i.estado === 'ahorrando' ? i.ahorrado : 0;
    return `<button class="grow" data-act="abrir" data-id="${r.id}">
        <span class="mono-tile" style="background:${E.soft};color:${E.color}">${esc(monogram(i.nombre))}</span>
        <span class="flex-1 min-w-0">
            <span class="flex items-center gap-2 mb-1">
                <span class="text-[15px] font-semibold truncate">${esc(i.nombre)}</span>
                <span class="badge" style="background:${E.soft};color:${E.color};border-color:transparent">${E.label}</span>
            </span>
            <span class="block text-[12px] mb-1.5" style="color:var(--ink-3)">
                ${i.pagadas} de ${i.n} semanas${i.share < 1 ? ` · pagás el ${Math.round(i.share * 100)}%` : ''}
            </span>
            <span class="meter block" style="max-width:200px"><i style="width:${i.progreso}%;background:${E.color}"></i></span>
        </span>
        <span class="text-right">
            <span class="num block text-[15.5px]" style="color:${i.estado === 'pagando' ? 'var(--neg)' : i.estado === 'ahorrando' ? 'var(--pos)' : 'var(--ink-3)'}">
                ${i.estado === 'terminada' ? '—' : (i.estado === 'pagando' ? '−' : '') + money(valor).replace('−', '')}
            </span>
            <span class="cur block">${i.estado === 'terminada' ? 'LISTA' : 'HNL'}</span>
        </span>
        <svg class="grow-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </button>`;
}

/* ---------------- Detalle ---------------- */
function renderDetail() {
    const r = rondas.find(x => x.id === route.id);
    if (!r) return go('list', null, false);
    const i = info(r), E = ESTADO_RONDA[i.estado];
    const weeks = Array.isArray(r.weeks) ? r.weeks : [];

    const grid = weeks.map((w, idx) => {
        const n = idx + 1;
        const pagada = w.status === 'paid';
        const dias = diasEntre(new Date(), new Date(w.date + 'T12:00:00'));
        const esTurno = n === i.turno;
        const st = pagada ? 'paid' : dias < 0 ? 'late' : dias <= 5 ? 'soon' : 'pend';
        const d = new Date(w.date + 'T12:00:00');
        return `<button class="cuota" data-s="${st}" data-act="toggle" data-id="${r.id}" data-n="${idx}"
                ${esTurno ? 'style="outline:2px solid var(--brand-text);outline-offset:1px"' : ''}
                title="Semana ${n} · ${fmid(w.date + 'T12:00:00')}${esTurno ? ' · tu turno' : ''}">
            <b>${esTurno ? '★' : n}</b><span>${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</span>
        </button>`;
    }).join('');

    swapView($('#v-detail'), `
        <button class="btn btn-quiet btn-sm -ml-3 mb-3" data-act="volver">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 18-6-6 6-6"/></svg> Mis rondas
        </button>

        ${i.estado === 'pagando' ? `
        <section class="gcard" style="border-left:3px solid var(--neg)">
            <div class="px-4 py-4">
                <p class="st st-late mb-2">Ya cobraste el bote</p>
                <p class="text-[13.5px]" style="color:var(--ink-2);line-height:1.6">
                    Recibiste <span class="num font-semibold">${money(i.monto)}</span> en tu turno.
                    Las <b>${i.pendientes}</b> semanas que faltan son deuda: <span class="num font-semibold">${money(i.deuda)}</span>.
                    Ya aparecen en Financiación junto a tus otras cuotas.
                </p>
            </div>
        </section>` : i.estado === 'ahorrando' && i.turno > 0 ? `
        <section class="gcard" style="border-left:3px solid var(--pos)">
            <div class="px-4 py-4">
                <p class="st st-ok mb-2">Ahorrando</p>
                <p class="text-[13.5px]" style="color:var(--ink-2);line-height:1.6">
                    Tu turno es la semana <b>${i.turno}</b>${i.fechaTurno ? ` (${flong(i.fechaTurno + 'T12:00:00')})` : ''}
                    y vas a recibir <span class="num font-semibold">${money(i.monto)}</span>.
                    A partir de ahí lo que falte pasa a ser deuda.
                </p>
            </div>
        </section>` : ''}

        <div>
            <section class="gcard hero">
                <div class="px-4 pt-4 pb-4">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="mono-tile" style="background:${E.soft};color:${E.color}">${esc(monogram(i.nombre))}</span>
                            <div class="min-w-0">
                                <h1 class="text-[17px] font-semibold truncate">${esc(i.nombre)}</h1>
                                <p class="text-[12px]" style="color:var(--ink-3)">${i.n} semanas · turno ${i.turno || '—'}</p>
                            </div>
                        </div>
                        <div class="flex gap-1 flex-none">
                            <button class="btn btn-quiet btn-sm" data-act="editar" data-id="${r.id}" aria-label="Editar" title="Editar">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                            </button>
                            <button class="btn btn-quiet btn-sm" data-act="borrar" data-id="${r.id}" aria-label="Eliminar" style="color:var(--neg)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                    <p class="tag mt-5">${i.estado === 'pagando' ? 'Me falta pagar' : i.estado === 'ahorrando' ? 'Llevo ahorrado' : 'Ronda saldada'}</p>
                    <p class="num text-[30px] leading-none mt-2" style="color:${i.estado === 'pagando' ? 'var(--neg)' : i.estado === 'ahorrando' ? 'var(--pos)' : 'var(--ink-3)'}" id="hero2">L 0.00</p>
                    <div class="meter mt-4" style="max-width:320px"><i style="width:${i.progreso}%;background:${E.color}"></i></div>
                    <p class="text-[12.5px] mt-2" style="color:var(--ink-3)">${i.pagadas} de ${i.n} semanas · aportado <span class="num">${money(i.aportado)}</span> de <span class="num">${money(i.totalAportar)}</span></p>
                </div>
                <div class="kpi">
                    <div><p class="tag">Mi cuota</p><p class="num text-[14.5px] mt-1.5">${money(i.cuota)}</p></div>
                    <div><p class="tag">Recibo</p><p class="num text-[14.5px] mt-1.5">${money(i.monto)}</p></div>
                    <div><p class="tag">Mi parte</p><p class="num text-[14.5px] mt-1.5">${Math.round(i.share * 100)}%</p></div>
                </div>
                <div class="gfoot flex items-center justify-between gap-3">
                    <span class="text-[12.5px]" style="color:var(--ink-2)">
                        ${i.share < 1 ? `Pagás ${Math.round(i.share * 100)}% de la cuota de ${money0(i.cuotaFull)}` : `Pagás la cuota completa`}
                    </span>
                    <button class="btn btn-outline btn-sm flex-none" data-act="share" data-id="${r.id}">Cambiar</button>
                </div>
            </section>
        </div>

        <div class="flex flex-wrap gap-2">
            <button class="btn ${i.recibido ? 'btn-outline' : 'btn-primary'}" data-act="cobrar" data-id="${r.id}">
                ${i.recibido ? 'No he cobrado el bote' : 'Ya cobré el bote'}
            </button>
            ${i.prox ? `<button class="btn btn-outline" data-act="toggle" data-id="${r.id}" data-n="${i.prox.n - 1}">Pagar semana ${i.prox.n}</button>` : ''}
        </div>

        <div>
            <p class="sec-title">Calendario de semanas</p>
            <section class="gcard"><div class="px-4 py-4">
                <div class="cuotas">${grid}</div>
                <div class="flex flex-wrap gap-x-4 gap-y-1.5 mt-4 text-[11.5px]" style="color:var(--ink-3)">
                    <span class="flex items-center gap-1.5"><i style="width:9px;height:9px;border-radius:2px;background:var(--pos);display:block"></i> Pagada</span>
                    <span class="flex items-center gap-1.5"><i style="width:9px;height:9px;border-radius:2px;border:1px solid #C99A3B;display:block"></i> Próxima</span>
                    <span class="flex items-center gap-1.5"><i style="width:9px;height:9px;border-radius:2px;background:var(--neg-soft);border:1px solid var(--neg);display:block"></i> Atrasada</span>
                    <span class="flex items-center gap-1.5">★ Tu turno</span>
                </div>
                <p class="text-[12px] mt-3" style="color:var(--ink-3)">Tocá una semana para marcarla como pagada.</p>
            </div></section>
        </div>
    `);
    countUp($('#hero2'), i.estado === 'pagando' ? i.deuda : i.estado === 'ahorrando' ? i.ahorrado : 0);
}

/* ---------------- Formularios ---------------- */
function dlgRonda(id = null) {
    const r = id ? rondas.find(x => x.id === id) : null;
    const i = r ? info(r) : null;
    const share = r ? i.share : shareSugerido();
    openDialog(`
    <h2 class="text-[17px] font-semibold mb-5">${r ? 'Editar ronda' : 'Nueva ronda'}</h2>
    <div class="space-y-4">
        <div><label class="label" for="rName">Nombre</label>
            <input id="rName" class="field" maxlength="40" placeholder="Ronda del barrio" value="${esc(r?.roundName || '')}" data-autofocus></div>
        <div class="grid grid-cols-2 gap-3">
            <div><label class="label" for="rAmount">Cuota completa</label>
                <input id="rAmount" class="field field-num" type="number" step="0.01" inputmode="decimal" placeholder="0.00" value="${r?.weeklyAmount || ''}"></div>
            <div><label class="label" for="rWeeks">Nº de semanas</label>
                <input id="rWeeks" class="field field-num" type="number" inputmode="numeric" min="2" max="200" value="${r?.numWeeks || 65}" ${r ? 'disabled style="opacity:.5"' : ''}></div>
        </div>
        <div>
            <label class="label">¿Qué parte de la cuota pagás vos?</label>
            <div class="flex gap-1.5 mb-2" id="rShare" data-v="${share}">
                ${[[1,'Completa'],[0.5,'Mitad'],[0.25,'Un cuarto']].map(([v,l]) =>
                  `<button type="button" class="chip" aria-pressed="${Math.abs(share - v) < 0.01}" data-act="pick-share" data-v="${v}">${l}</button>`).join('')}
                <button type="button" class="chip" aria-pressed="${![1,0.5,0.25].some(v => Math.abs(share - v) < 0.01)}" data-act="pick-share" data-v="otro">Otro</button>
            </div>
            <div id="rShareOtro" class="${[1,0.5,0.25].some(v => Math.abs(share - v) < 0.01) ? 'hidden' : ''}">
                <div class="flex items-center gap-2">
                    <input id="rSharePct" class="field field-num" type="number" min="1" max="100" step="1" value="${Math.round(share * 100)}" style="max-width:110px">
                    <span class="text-[13.5px]" style="color:var(--ink-2)">% de la cuota</span>
                </div>
            </div>
            <p class="text-[12.5px] mt-2" style="color:var(--ink-3)">
                Pagás <span class="num" id="rPago" style="color:var(--ink)">L 0.00</span> por semana y recibís
                <span class="num" id="rBote" style="color:var(--ink)">L 0.00</span> en tu turno.
            </p>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div><label class="label" for="rStart">Primera semana</label>
                <input id="rStart" class="field" type="date" value="${r?.startDate || todayStr()}" ${r ? 'disabled style="opacity:.5"' : ''}></div>
            <div><label class="label" for="rTurno">Semana de tu turno</label>
                <input id="rTurno" class="field field-num" type="number" inputmode="numeric" min="1" value="${r?.payoutWeek || ''}" placeholder="Ej. 30"></div>
        </div>
        ${dialogFooter(r ? 'save-edit' : 'save-new', r ? 'Guardar cambios' : 'Crear ronda', r?.id || '')}
    </div>`);
    const upd = () => {
        const monto = num('#rAmount');
        const n = Math.max(2, parseInt($('#rWeeks').value) || 2);
        const sv = $('#rShare').dataset.v;
        const sh = sv === 'otro' ? Math.min(1, Math.max(0.01, (parseInt($('#rSharePct').value) || 100) / 100)) : Number(sv);
        $('#rPago').textContent = money(monto * sh);
        $('#rBote').textContent = money(monto * sh * n);
    };
    ['#rAmount', '#rWeeks', '#rSharePct'].forEach(s => $(s)?.addEventListener('input', upd));
    upd();
}

function dlgShare(id) {
    const r = rondas.find(x => x.id === id);
    const i = info(r);
    openDialog(`
    <h2 class="text-[17px] font-semibold mb-1">Tu parte de la cuota</h2>
    <p class="text-[13px] mb-5" style="color:var(--ink-3)">La cuota completa de esta ronda es ${money(i.cuotaFull)}</p>
    <div class="space-y-4">
        <div class="flex gap-1.5" id="sShare" data-v="${i.share}">
            ${[[1,'Completa'],[0.5,'Mitad'],[0.25,'Un cuarto']].map(([v,l]) =>
              `<button type="button" class="chip" aria-pressed="${Math.abs(i.share - v) < 0.01}" data-act="pick-s2" data-v="${v}">${l}</button>`).join('')}
        </div>
        <div>
            <label class="label" for="sPct">O escribí el porcentaje</label>
            <div class="flex items-center gap-2">
                <input id="sPct" class="field field-num" type="number" min="1" max="100" value="${Math.round(i.share * 100)}" style="max-width:110px" data-autofocus>
                <span class="text-[13.5px]" style="color:var(--ink-2)">%</span>
            </div>
        </div>
        <div class="px-3 py-3" style="background:var(--sunk);border-radius:8px">
            <p class="text-[13px]" style="color:var(--ink-2)">
                Pagás <span class="num font-semibold" id="sPago" style="color:var(--ink)">${money(i.cuota)}</span> por semana ·
                recibís <span class="num font-semibold" id="sBote" style="color:var(--ink)">${money(i.monto)}</span> en tu turno
            </p>
        </div>
        <p class="text-[12px]" style="color:var(--ink-3)">Este porcentaje queda como sugerencia para las próximas rondas que crees.</p>
        ${dialogFooter('save-share', 'Guardar', id)}
    </div>`);
    const upd = () => {
        const sh = Math.min(1, Math.max(0.01, (parseInt($('#sPct').value) || 100) / 100));
        $('#sPago').textContent = money(i.cuotaFull * sh);
        $('#sBote').textContent = money(i.cuotaFull * sh * i.n);
        $('#sShare').dataset.v = sh;
        $('#sShare').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', Math.abs(Number(b.dataset.v) - sh) < 0.01));
    };
    $('#sPct').addEventListener('input', upd);
}

/* ---------------- Escrituras ---------------- */
function semanas(startDate, n) {
    const out = [];
    let cur = new Date(startDate + 'T12:00:00');
    for (let k = 0; k < n; k++) {
        const d = new Date(cur);
        const hastaDomingo = (7 - d.getDay()) % 7;
        d.setDate(d.getDate() + (hastaDomingo === 0 && k > 0 ? 7 : hastaDomingo));
        out.push({ date: isoToDate(d.toISOString()), status: 'pending' });
        cur = new Date(d); cur.setDate(cur.getDate() + 1);
    }
    return out;
}
const leerShare = (sel) => {
    const v = $(sel).dataset.v;
    if (v === 'otro') return Math.min(1, Math.max(0.01, (parseInt($('#rSharePct').value) || 100) / 100));
    return Math.min(1, Math.max(0.01, Number(v) || 1));
};

async function crear() {
    const name = ($('#rName').value || '').trim();
    const monto = num('#rAmount');
    const n = Math.max(2, parseInt($('#rWeeks').value) || 2);
    const turno = parseInt($('#rTurno').value) || 0;
    const start = $('#rStart').value;
    if (!name)  { notice('Escribí el nombre de la ronda', 'neg'); return; }
    if (monto <= 0) { notice('Escribí la cuota completa', 'neg'); return; }
    if (!start) { notice('Elegí la fecha de la primera semana', 'neg'); return; }
    if (turno < 1 || turno > n) { notice(`El turno debe estar entre 1 y ${n}`, 'neg'); return; }
    const share = leerShare('#rShare');
    try {
        const ref = await addDoc(collection(db, COL.rondas), {
            roundName: name, weeklyAmount: monto, numWeeks: n, startDate: start,
            payoutWeek: turno, share, weeks: semanas(start, n), createdAt: new Date().toISOString()
        });
        recordarShare(share);
        closeDialog(); notice('Ronda creada', 'pos'); go('detail', ref.id);
    } catch (e) { notice('No se pudo crear: ' + e.message, 'neg'); }
}

async function editar(id) {
    const name = ($('#rName').value || '').trim();
    const monto = num('#rAmount');
    const turno = parseInt($('#rTurno').value) || 0;
    const r = rondas.find(x => x.id === id);
    const n = Number(r.numWeeks) || (r.weeks || []).length;
    if (!name) { notice('Escribí el nombre', 'neg'); return; }
    if (monto <= 0) { notice('Escribí la cuota completa', 'neg'); return; }
    if (turno < 1 || turno > n) { notice(`El turno debe estar entre 1 y ${n}`, 'neg'); return; }
    const share = leerShare('#rShare');
    try {
        await updateDoc(doc(db, COL.rondas, id), { roundName: name, weeklyAmount: monto, payoutWeek: turno, share });
        recordarShare(share);
        closeDialog(); notice('Ronda actualizada');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function guardarShare(id) {
    const share = Math.min(1, Math.max(0.01, (parseInt($('#sPct').value) || 100) / 100));
    try {
        await updateDoc(doc(db, COL.rondas, id), { share });
        recordarShare(share);
        closeDialog(); notice(`Ahora pagás el ${Math.round(share * 100)}% de la cuota`, 'pos');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function marcar(id, idx) {
    const r = rondas.find(x => x.id === id);
    const w = [...(r.weeks || [])];
    if (!w[idx]) return;
    const era = w[idx].status === 'paid';
    w[idx] = { ...w[idx], status: era ? 'pending' : 'paid' };
    try {
        await updateDoc(doc(db, COL.rondas, id), { weeks: w });
        if (!era) {
            const i = rondaInfo({ ...r, weeks: w });
            notice(i.terminada ? '¡Ronda completada!' :
                   i.estado === 'pagando' ? `Semana pagada · faltan ${i.pendientes}` :
                   `Semana pagada · llevás ${money0(i.ahorrado)}`, 'pos');
        } else notice('Semana desmarcada');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function cobrar(id) {
    const r = rondas.find(x => x.id === id);
    const i = info(r);
    if (i.recibido) {
        try { await updateDoc(doc(db, COL.rondas, id), { received: false }); notice('Marcada como no cobrada'); }
        catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
        return;
    }
    const ok = await askConfirm({ title: 'Ya cobraste el bote', label: 'Sí, ya lo recibí',
        body: `Recibís <span class="num">${money(i.monto)}</span>. A partir de ahora las ${i.pendientes} semanas que faltan
               dejan de ser ahorro y pasan a contar como deuda, y aparecen en Financiación.` });
    if (!ok) return;
    try { await updateDoc(doc(db, COL.rondas, id), { received: true }); notice('Ronda en fase de pago', 'pos'); }
    catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function borrar(id) {
    const r = rondas.find(x => x.id === id);
    const i = info(r);
    const ok = await askConfirm({ title: 'Eliminar ronda', danger: true, key: true, label: 'Eliminar',
        body: `Se borra <b>${esc(i.nombre)}</b> con sus ${i.n} semanas. No se puede deshacer.` });
    if (!ok) return;
    try { await deleteDoc(doc(db, COL.rondas, id)); go('list'); notice('Ronda eliminada'); }
    catch (e) { notice('No se pudo eliminar: ' + e.message, 'neg'); }
}

/* ---------------- Eventos ---------------- */
document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const { act, id, n, v } = el.dataset;
    switch (act) {
        case 'nueva':  dlgRonda(); break;
        case 'abrir':  go('detail', id); break;
        case 'volver': go('list'); break;
        case 'editar': dlgRonda(id); break;
        case 'borrar': borrar(id); break;
        case 'toggle': marcar(id, Number(n)); break;
        case 'cobrar': cobrar(id); break;
        case 'share':  dlgShare(id); break;
        case 'save-new':   crear(); break;
        case 'save-edit':  editar(id); break;
        case 'save-share': guardarShare(id); break;
        case 'pick-share':
            $('#rShare').dataset.v = v;
            $('#rShare').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
            $('#rShareOtro').classList.toggle('hidden', v !== 'otro');
            $('#rAmount').dispatchEvent(new Event('input'));
            break;
        case 'pick-s2':
            $('#sPct').value = Math.round(Number(v) * 100);
            $('#sPct').dispatchEvent(new Event('input'));
            break;
    }
});

/* ---------------- Arranque ---------------- */
mountShell('Rondas', null);
let listo = false;
function mostrar() {
    if (listo) return;
    listo = true;
    $('#boot').classList.add('hidden');
    $('#app').classList.remove('hidden');
    saludo();
    history.replaceState({ view: 'list', id: null }, '');
    render();
}
bootShell({ onReady: () => {
    onSnapshot(query(collection(db, COL.rondas)), (snap) => {
        rondas = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        mostrar(); render();
    }, (err) => { mostrar(); notice('Sin conexión con la nube', 'neg'); console.error(err); });
}});
</script>
