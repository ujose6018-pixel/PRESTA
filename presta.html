<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Préstamos · Caudal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#7B2CBF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Préstamos">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css">
<script>(function(){var s=localStorage.getItem("mf-theme");document.documentElement.dataset.theme=s?s:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");})();</script>
<style></style>
</head>
<body>

<div id="boot" class="fixed inset-0 grid place-items-center" style="background:var(--paper);z-index:90">
    <div class="wrap w-full" style="max-width:420px">
        <div class="skel h-4 w-28 mb-4"></div><div class="skel h-24 w-full mb-3"></div><div class="skel h-16 w-full"></div>
    </div>
</div>

<!-- Red de seguridad: script clásico, corre aunque el módulo falle al cargar. -->
<script>
(function () {
    var mostrado = false;
    function caer(detalle) {
        if (mostrado) return;
        var b = document.getElementById('boot');
        if (!b || b.classList.contains('hidden')) return;
        mostrado = true;
        b.innerHTML =
            '<div style="max-width:340px;padding:24px;text-align:center">' +
            '<p style="font-size:17px;font-weight:600;margin-bottom:8px">No se pudo cargar la página</p>' +
            '<p style="font-size:13.5px;line-height:1.6;color:#878D98;margin-bottom:18px">' +
            'Revisá tu conexión y volvé a intentar. Si sigue igual, cerrá la aplicación y abrila de nuevo.</p>' +
            '<button onclick="location.reload()" style="padding:10px 20px;border-radius:7px;border:0;' +
            'background:#C41E30;color:#fff;font-weight:600;font-size:14px;cursor:pointer">Reintentar</button>' +
            '<p style="font-size:11px;color:#878D98;margin-top:16px;word-break:break-word;font-family:monospace">' +
            String(detalle || '').slice(0, 160) + '</p></div>';
    }
    window.addEventListener('error', function (e) { caer(e.message || (e.target && e.target.src) || 'error'); }, true);
    window.addEventListener('unhandledrejection', function (e) { caer(e.reason); });
    setTimeout(function () { caer('La carga tardó demasiado'); }, 15000);
})();
</script>

<div id="app" class="hidden">
    <div id="shell"></div>
    <div class="greet">
        <div class="wrap greet-in">
            <span class="greet-ico" id="greet-ico"></span>
            <div class="flex-1 min-w-0">
                <p class="text-[16px] font-semibold truncate" id="greet-text">Hola</p>
                <p class="text-[12px]" style="color:var(--ink-3)">Dinero que me deben</p>
            </div>
        </div>
    </div>
    <button class="fab" data-act="nuevo">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nuevo préstamo
    </button>
    <main class="wrap py-5">
        <section id="v-list"></section>
        <section id="v-detail" class="hidden"></section>
    </main>
</div>

<script type="module">
import { db, COL, collection, doc, addDoc, onSnapshot, updateDoc, deleteDoc, query,
         $, esc, money, money0, monogram, tint, flong, fmid, todayStr, isoToDate, diasEntre,
         notice, openDialog, closeDialog, askConfirm, num, dialogFooter, bootShell, mountShell,
         saludo, swapView, countUp,
         esTercero, duenoDe, badgeTercero, selectorTitular, leerTitular, clicTitular } from './core.js';

let prestamos = [], route = { view: 'list', id: null };
const AVISO = 5;

/* ---------------- Cálculos (idénticos a la versión anterior) ---------------- */
const capital   = (p) => parseFloat(p.currentCapital) || 0;
const tasa      = (p) => parseFloat(p.interestRate) || 0;
const comision  = (p) => parseFloat(p.commissionRate) || 0;
const cuotas    = (p) => Array.isArray(p.quotas) ? p.quotas : [];
const saldado   = (p) => capital(p) <= 0;
const interesBase = (p) => (capital(p) * tasa(p)) / 100;
const interesDe = (p, q) => interesBase(p) * (Number(q.interestMultiplier) || 1);
const comisionDe = (p, q) => interesDe(p, q) * (comision(p) / 100);
/* Qué proporción del rédito termina en tu bolsillo:
   - capital propio: todo menos la comisión que se lleva el intermediario
   - capital de otro: solo tu comisión, el resto es del dueño del dinero */
const factorMio  = (p) => esTercero(p) ? comision(p) / 100 : 1 - comision(p) / 100;
const netoDe     = (p, q) => interesDe(p, q) * factorMio(p);
const netoDueno  = (p, q) => esTercero(p) ? interesDe(p, q) - netoDe(p, q) : 0;

const proxima = (p) => cuotas(p).find(q => q.status === 'pending') || null;
const pagadas = (p) => cuotas(p).filter(q => q.status === 'paid');
const cobrado = (p) => pagadas(p).reduce((a, q) => a + netoDe(p, q), 0);
const vencidas = (p) => cuotas(p).filter(q => q.status === 'pending' && diasEntre(new Date(), new Date(q.date + 'T12:00:00')) < 0).length;

const activos = () => prestamos.filter(p => !saldado(p));
const mios    = () => activos().filter(p => !esTercero(p));
const ajenos  = () => activos().filter(esTercero);
/* Solo el capital propio es tuyo. El de terceros se administra, no se posee. */
const capitalTotal        = () => mios().reduce((a, p) => a + capital(p), 0);
const capitalAdministrado = () => ajenos().reduce((a, p) => a + capital(p), 0);
const proximoCobro = () => activos().reduce((a, p) => { const q = proxima(p); return a + (q ? netoDe(p, q) : 0); }, 0);
const porMes = (p) => p.frequency === 'quincenal' ? 2 : 4.33;
const interesMensual = () => activos().reduce((a, p) => a + interesBase(p) * factorMio(p) * porMes(p), 0);

function alertas() {
    return activos().map(p => {
        const q = proxima(p);
        if (!q) return null;
        const dias = diasEntre(new Date(), new Date(q.date + 'T12:00:00'));
        return dias <= AVISO ? { p, q, dias, estado: dias < 0 ? 'late' : 'soon' } : null;
    }).filter(Boolean).sort((a, b) => a.dias - b.dias);
}
const textoDias = (d) => d < 0 ? `atrasado ${Math.abs(d)} día${Math.abs(d) === 1 ? '' : 's'}`
                       : d === 0 ? 'cobra hoy' : d === 1 ? 'cobra mañana' : `en ${d} días`;

/* ---------------- Navegación ---------------- */
function go(view, id = null, push = true) {
    route = { view, id };
    if (push) history.pushState({ view, id }, '');
    $('#v-list').classList.toggle('hidden', view !== 'list');
    $('#v-detail').classList.toggle('hidden', view !== 'detail');
    window.scrollTo(0, 0);
    render();
}
window.addEventListener('popstate', (e) => {
    if (document.querySelector('#dialog.open')) return;
    const s = e.state || { view: 'list' };
    go(s.view || 'list', s.id || null, false);
});
const render = () => route.view === 'list' ? renderList() : renderDetail();

/* ---------------- Lista ---------------- */
function renderList() {
    const al = mios(), adm = ajenos(), fin = prestamos.filter(saldado), av = alertas();
    const admCap = capitalAdministrado();

    swapView($('#v-list'), `
        ${av.length ? `
        <div>
            <p class="sec-title">Cobros pendientes</p>
            <section class="gcard">
                ${av.slice(0, 4).map(({ p, q, dias, estado }) => `
                <button class="grow" data-act="abrir" data-id="${p.id}"
                        style="border-left:3px solid ${estado === 'late' ? 'var(--neg)' : '#C99A3B'}">
                    <span class="mono-tile" style="background:${estado === 'late' ? 'var(--neg-soft)' : '#FFF4E0'};color:${estado === 'late' ? 'var(--neg)' : '#8A5A1E'}"><span class="dot-pulse"></span></span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-[14.5px] font-semibold truncate">${esc(p.clientName)}</span>
                        <span class="block text-[12px] mt-0.5" style="color:var(--ink-3)">${fmid(q.date + 'T12:00:00')} · ${textoDias(dias)}</span>
                    </span>
                    <span class="text-right">
                        <span class="num block text-[15px]">${money(netoDe(p, q))}</span>
                        <span class="cur block">HNL</span>
                    </span>
                </button>`).join('')}
            </section>
        </div>` : ''}

        <div>
            <p class="sec-title">Mi cartera</p>
            <section class="gcard hero">
                <div class="px-4 pt-4 pb-4">
                    <p class="tag">Capital en la calle</p>
                    <p class="num text-[30px] leading-none mt-2" style="color:var(--accent)" id="hero">L 0.00</p>
                    <p class="text-[12px] mt-2 font-semibold" style="opacity:.75">
                        ${al.length ? `${al.length} préstamo${al.length === 1 ? '' : 's'} con tu capital` : 'Sin capital propio prestado'}
                    </p>
                    ${interesMensual() > 0 ? `
                    <div class="mt-4 pt-3.5" style="border-top:1px solid var(--rule)">
                        <span class="passive">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                            ${money0(interesMensual())} al mes de rédito neto
                        </span>
                    </div>` : ''}
                </div>
                <div class="kpi">
                    <div><p class="tag">Próximo cobro</p><p class="num text-[14.5px] mt-1.5 pos">${money(proximoCobro())}</p></div>
                    <div><p class="tag">Míos</p><p class="num text-[14.5px] mt-1.5">${al.length}</p></div>
                    <div><p class="tag">Administro</p><p class="num text-[14.5px] mt-1.5">${adm.length}</p></div>
                </div>
            </section>
        </div>

        <div>
            <p class="sec-title">Con mi capital</p>
            ${al.length ? `<section class="gcard">${al.map(fila).join('')}</section>` : `
            <section class="gcard"><div class="px-4 py-5">
                <h2 class="text-[16px] font-semibold mb-2">Sin préstamos activos</h2>
                <p class="text-[13.5px] mb-4" style="color:var(--ink-2);line-height:1.6">
                    Registrá a quién le prestaste, cuánto y con qué rédito. La aplicación arma el calendario de cobro
                    y te avisa cuando se acerca cada fecha.</p>
                <button class="btn btn-primary" data-act="nuevo">Registrar préstamo</button>
            </div></section>`}
        </div>

        ${adm.length ? `<div>
            <p class="sec-title">Préstamos que administro</p>
            <section class="gcard">
                ${adm.map(fila).join('')}
                <div class="gfoot">
                    <p class="text-[12.5px]" style="color:var(--ink-2);line-height:1.6">
                        El capital lo pone otra persona: <span class="num">${money(admCap)}</span> en la calle.
                        <b>No cuenta como tuyo</b> ni en el patrimonio ni en la salud financiera —
                        aquí solo llevás el control de lo que se prestó por medio tuyo.
                    </p>
                </div>
            </section>
        </div>` : ''}

        ${fin.length ? `<div>
            <p class="sec-title">Saldados</p>
            <section class="gcard">${fin.map(fila).join('')}</section>
        </div>` : ''}
    `);
    countUp($('#hero'), capitalTotal());
}

function fila(p) {
    const fin = saldado(p), q = proxima(p), v = vencidas(p);
    const pct = cuotas(p).length ? (pagadas(p).length / cuotas(p).length) * 100 : 0;
    return `<button class="grow" data-act="abrir" data-id="${p.id}">
        <span class="mono-tile" style="background:${fin ? 'var(--pos-soft)' : tint('#17436F', .12)};color:${fin ? 'var(--pos)' : 'var(--accent)'}">${esc(monogram(p.clientName))}</span>
        <span class="flex-1 min-w-0">
            <span class="flex items-center gap-2 mb-1 flex-wrap">
                <span class="text-[15px] font-extrabold truncate">${esc(p.clientName)}</span>
                ${badgeTercero(p)}
                ${v > 0 ? `<span class="badge" style="background:var(--neg-soft);color:var(--neg)">${v} atrasada${v === 1 ? '' : 's'}</span>` : ''}
            </span>
            <span class="block text-[12px] mb-1.5" style="color:var(--ink-3)">
                ${fin ? 'Capital recuperado' : `${tasa(p)}% ${p.frequency === 'quincenal' ? 'quincenal' : 'semanal'}${q ? ` · próximo ${fmid(q.date + 'T12:00:00')}` : ''}`}
            </span>
            <span class="meter block" style="max-width:200px"><i style="width:${pct}%;background:${fin ? 'var(--pos)' : 'var(--accent)'}"></i></span>
        </span>
        <span class="text-right">
            <span class="num block text-[15.5px]" style="color:${fin ? 'var(--pos)' : 'var(--accent)'}">${fin ? '—' : money(capital(p))}</span>
            <span class="cur block">${fin ? 'SALDADO' : 'HNL'}</span>
        </span>
        <svg class="grow-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </button>`;
}

/* ---------------- Detalle ---------------- */
function renderDetail() {
    const p = prestamos.find(x => x.id === route.id);
    if (!p) return go('list', null, false);
    const fin = saldado(p), q = proxima(p);
    const pct = cuotas(p).length ? (pagadas(p).length / cuotas(p).length) * 100 : 0;
    const dias = q ? diasEntre(new Date(), new Date(q.date + 'T12:00:00')) : null;

    const grid = cuotas(p).map((c, idx) => {
        const pagada = c.status === 'paid';
        const d = diasEntre(new Date(), new Date(c.date + 'T12:00:00'));
        const st = pagada ? 'paid' : d < 0 ? 'late' : d <= AVISO ? 'soon' : 'pend';
        const dt = new Date(c.date + 'T12:00:00');
        return `<button class="cuota" data-s="${st}" data-act="toggle" data-id="${p.id}" data-qid="${c.id}"
                title="Cuota ${idx + 1} · ${fmid(c.date + 'T12:00:00')} · ${money(netoDe(p, c))}">
            <b>${idx + 1}</b><span>${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}</span>
        </button>`;
    }).join('');

    swapView($('#v-detail'), `
        <button class="btn btn-quiet btn-sm -ml-3 mb-3" data-act="volver">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 18-6-6 6-6"/></svg> Mis préstamos
        </button>

        ${q && dias !== null && dias <= AVISO ? `
        <section class="gcard" style="border-left:3px solid ${dias < 0 ? 'var(--neg)' : '#C99A3B'}">
            <div class="px-4 py-4">
                <p class="st ${dias < 0 ? 'st-late' : 'st-soon'} mb-2">${dias < 0 ? 'Cobro atrasado' : 'Se acerca el cobro'}</p>
                <p class="text-[14px] font-semibold">${money(netoDe(p, q))} · ${flong(q.date + 'T12:00:00')}</p>
                <p class="text-[13px] mt-1" style="color:var(--ink-2)">${textoDias(dias)}.</p>
                <button class="btn btn-primary mt-3.5" data-act="toggle" data-id="${p.id}" data-qid="${q.id}">Ya me pagó</button>
            </div>
        </section>` : ''}

        <div>
            <section class="gcard hero">
                <div class="px-4 pt-4 pb-4">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="mono-tile" style="background:${fin ? 'var(--pos-soft)' : tint('#17436F', .12)};color:${fin ? 'var(--pos)' : 'var(--accent)'}">${esc(monogram(p.clientName))}</span>
                            <div class="min-w-0">
                                <h1 class="text-[17px] font-extrabold truncate">${esc(p.clientName)}</h1>
                                <p class="text-[12px]" style="color:var(--ink-3)">${p.intermediaryName ? 'Vía ' + esc(p.intermediaryName) + ' · ' : ''}desde el ${flong(p.startDate + 'T12:00:00')}</p>
                            </div>
                        </div>
                        <button class="btn btn-quiet btn-sm flex-none" data-act="borrar" data-id="${p.id}" aria-label="Eliminar" style="color:var(--neg)">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                    ${esTercero(p) ? `<div class="mt-4"><span class="badge" style="background:var(--accent-soft);color:var(--accent)">Capital de ${esc(duenoDe(p))}</span></div>` : ''}
                    <p class="tag mt-5">${fin ? 'Capital recuperado' : esTercero(p) ? `Capital de ${esc(duenoDe(p))}` : 'Capital vivo'}</p>
                    <p class="num text-[30px] leading-none mt-2" style="color:${fin ? 'var(--pos)' : 'var(--accent)'}" id="hero2">L 0.00</p>
                    <div class="meter mt-4" style="max-width:320px"><i style="width:${pct}%;background:${fin ? 'var(--pos)' : 'var(--accent)'}"></i></div>
                    <p class="text-[12.5px] mt-2" style="color:var(--ink-3)">
                        ${pagadas(p).length} de ${cuotas(p).length} cuotas cobradas${esTercero(p) ? (cobrado(p) > 0 ? ` · llevás <span class="num">${money(cobrado(p))}</span> de comisión` : ' · sin comisión para vos') : ` · llevo <span class="num">${money(cobrado(p))}</span> de rédito neto`}
                    </p>
                </div>
                <div class="kpi">
                    <div><p class="tag">Rédito</p><p class="num text-[14.5px] mt-1.5">${tasa(p)}%</p></div>
                    <div><p class="tag">Cada</p><p class="num text-[14.5px] mt-1.5">${p.frequency === 'quincenal' ? '15 días' : 'semana'}</p></div>
                    <div><p class="tag">Comisión</p><p class="num text-[14.5px] mt-1.5">${comision(p)}%</p></div>
                </div>
                ${q ? `<div class="gfoot">
                    <p class="text-[12.5px]" style="color:var(--ink-2);line-height:1.6">
                        ${esTercero(p)
                          ? `Próxima cuota: rédito <span class="num">${money(interesDe(p, q))}</span> ·
                             <span class="num" style="color:var(--ink)">${money(netoDueno(p, q))}</span> para ${esc(duenoDe(p))}${netoDe(p, q) > 0 ? ` · <span class="num" style="color:var(--ink)">${money(netoDe(p, q))}</span> para vos` : ' · vos no cobrás comisión'}`
                          : `Próxima cuota: rédito <span class="num">${money(interesDe(p, q))}</span>${comision(p) > 0 ? ` menos comisión <span class="num">${money(comisionDe(p, q))}</span>` : ''} =
                             <span class="num font-extrabold" style="color:var(--ink)">${money(netoDe(p, q))}</span> para vos`}
                    </p>
                </div>` : ''}
            </section>
        </div>

        ${!fin ? `<div class="flex flex-wrap gap-2">
            <button class="btn btn-primary" data-act="abonar" data-id="${p.id}">Abonar a capital</button>
            ${q ? `<button class="btn btn-outline" data-act="toggle" data-id="${p.id}" data-qid="${q.id}">Cobré la cuota</button>` : ''}
        </div>` : ''}

        <div>
            <p class="sec-title">Calendario de cobro</p>
            <section class="gcard"><div class="px-4 py-4">
                <div class="cuotas">${grid}</div>
                <div class="flex flex-wrap gap-x-4 gap-y-1.5 mt-4 text-[11.5px]" style="color:var(--ink-3)">
                    <span class="flex items-center gap-1.5"><i style="width:9px;height:9px;border-radius:2px;background:var(--pos);display:block"></i> Cobrada</span>
                    <span class="flex items-center gap-1.5"><i style="width:9px;height:9px;border-radius:2px;border:1px solid #C99A3B;display:block"></i> Próxima</span>
                    <span class="flex items-center gap-1.5"><i style="width:9px;height:9px;border-radius:2px;background:var(--neg-soft);border:1px solid var(--neg);display:block"></i> Atrasada</span>
                </div>
                <p class="text-[12px] mt-3" style="color:var(--ink-3)">Tocá una cuota para marcarla como cobrada.</p>
            </div></section>
        </div>
    `);
    countUp($('#hero2'), capital(p));
}

/* ---------------- Formularios ---------------- */
function dlgNuevo() {
    openDialog(`
    <h2 class="text-[17px] font-semibold mb-5">Nuevo préstamo</h2>
    <div class="space-y-4">
        <div><label class="label" for="pName">¿A quién le prestás?</label>
            <input id="pName" class="field" maxlength="40" placeholder="Nombre del cliente" data-autofocus></div>
        <div><label class="label" for="pInter">Intermediario <span class="hint">— opcional</span></label>
            <input id="pInter" class="field" maxlength="40" placeholder="Quién lo consiguió"></div>
        ${selectorTitular('prestamo', 'mio', '')}
        <div class="grid grid-cols-2 gap-3">
            <div><label class="label" for="pCap">Capital</label>
                <input id="pCap" class="field field-num" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
            <div><label class="label" for="pRate">Rédito por periodo</label>
                <input id="pRate" class="field field-num" type="number" step="0.1" inputmode="decimal" placeholder="Ej. 10"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div><label class="label" for="pFreq">Frecuencia</label>
                <select id="pFreq" class="field">
                    <option value="semanal">Semanal</option>
                    <option value="quincenal">Quincenal</option>
                </select></div>
            <div><label class="label" for="pComm"><span id="pCommLbl">Comisión</span> <span class="hint">— % del rédito</span></label>
                <input id="pComm" class="field field-num" type="number" step="0.1" inputmode="decimal" placeholder="0"></div>
        </div>
        <div><label class="label" for="pStart">Fecha de entrega</label>
            <input id="pStart" class="field" type="date" value="${todayStr()}"></div>
        <div class="px-4 py-3.5" style="background:var(--sunk);border-radius:14px">
            <p class="text-[13px] font-semibold" style="color:var(--ink-2)" id="pPrevTxt"></p>
        </div>
        ${dialogFooter('save-new', 'Registrar préstamo')}
    </div>`);
    const upd = () => {
        const tercero = $('#tTitular')?.dataset.v === 'tercero';
        const rendimiento = num('#pCap') * (num('#pRate') / 100);
        const mio = rendimiento * (tercero ? num('#pComm') / 100 : 1 - num('#pComm') / 100);
        const ajeno = rendimiento - mio;
        $('#pCommLbl').textContent = tercero ? 'Tu comisión' : 'Comisión';
        $('#pPrevTxt').innerHTML = tercero
            ? `El rédito de <span class="num" style="color:var(--ink)">${money(rendimiento)}</span> por periodo es de quien puso el capital.
               A vos te quedan <span class="num" style="color:var(--ink)">${money(mio)}</span>${mio <= 0 ? ' — solo llevás el control' : ''}.`
            : `Cobrarías <span class="num" style="color:var(--ink)">${money(mio)}</span> por periodo, ya descontada la comisión${ajeno > 0 ? ` de ${money(ajeno)}` : ''}.`;
    };
    ['#pCap', '#pRate', '#pComm'].forEach(x => $(x).addEventListener('input', upd));
    $('#tTitular').addEventListener('click', () => setTimeout(upd, 0));
    upd();
}

function dlgAbono(id) {
    const p = prestamos.find(x => x.id === id);
    openDialog(`
    <h2 class="text-[17px] font-semibold mb-1">Abonar a capital</h2>
    <p class="text-[13px] mb-5" style="color:var(--ink-3)">${esc(p.clientName)} · capital vivo <span class="num">${money(capital(p))}</span></p>
    <div class="space-y-4">
        <div>
            <label class="label" for="aAmount">Monto abonado</label>
            <input id="aAmount" class="field field-num text-[19px] font-semibold" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" data-autofocus>
            <div class="flex flex-wrap gap-1.5 mt-2">
                ${[500, 1000, 5000].map(v => `<button type="button" class="chip" data-act="a-set" data-v="${v}">${v.toLocaleString('es-HN')}</button>`).join('')}
                <button type="button" class="chip" data-act="a-set" data-v="${capital(p)}">Todo el capital</button>
            </div>
        </div>
        <p class="text-[12.5px]" style="color:var(--ink-3)">Baja el capital vivo, así que el rédito de las próximas cuotas se recalcula solo.</p>
        ${dialogFooter('save-abono', 'Registrar abono', id)}
    </div>`);
}

/* ---------------- Escrituras ---------------- */
/** Genera el calendario. Es el mismo algoritmo de siempre, sin cambios. */
function generarCuotas(startDate, frequency, n = 24) {
    const out = [];
    let cur = new Date(startDate + 'T00:00:00');
    for (let i = 1; i <= n; i++) {
        const next = new Date(cur);
        if (frequency === 'quincenal') {
            if (next.getDate() < 16 && next.getDate() >= 1) next.setDate(16);
            else { next.setMonth(next.getMonth() + 1); next.setDate(1); }
        } else {
            const hastaDomingo = (7 - next.getDay()) % 7;
            next.setDate(next.getDate() + (hastaDomingo === 0 ? 7 : hastaDomingo));
        }
        let mult = 1;
        if (i === 1) {
            const d = Math.ceil(Math.abs(next - new Date(startDate + 'T00:00:00')) / 86400000);
            mult = Math.min(1, d / (frequency === 'quincenal' ? 15 : 7));
        }
        out.push({ id: 'q_' + Date.now() + '_' + i, date: next.toISOString().split('T')[0], status: 'pending', interestMultiplier: mult });
        cur = next;
    }
    return out;
}

async function crear() {
    const name = ($('#pName').value || '').trim();
    const cap = num('#pCap'), rate = num('#pRate'), start = $('#pStart').value;
    if (!name)     { notice('Escribí a quién le prestás', 'neg'); return; }
    if (cap <= 0)  { notice('Escribí el capital', 'neg'); return; }
    if (rate <= 0) { notice('Escribí el rédito', 'neg'); return; }
    if (!start)    { notice('Elegí la fecha de entrega', 'neg'); return; }
    const freq = $('#pFreq').value;
    try {
        const ref = await addDoc(collection(db, COL.prestamos), {
            clientName: name, intermediaryName: ($('#pInter').value || '').trim(),
            initialCapital: cap, currentCapital: cap, startDate: start, frequency: freq,
            interestRate: rate, commissionRate: num('#pComm'), ...leerTitular(),
            quotas: generarCuotas(start, freq), createdAt: new Date().toISOString()
        });
        closeDialog(); notice('Préstamo registrado', 'pos'); go('detail', ref.id);
    } catch (e) { notice('No se pudo crear: ' + e.message, 'neg'); }
}

async function marcar(id, qid) {
    const p = prestamos.find(x => x.id === id);
    const q = cuotas(p).find(x => x.id === qid);
    if (!q) return;
    const era = q.status === 'paid';
    const lista = cuotas(p).map(x => x.id === qid ? { ...x, status: era ? 'pending' : 'paid' } : x);
    try {
        await updateDoc(doc(db, COL.prestamos, id), { quotas: lista });
        notice(era ? 'Cuota desmarcada'
             : esTercero(p) ? `Cuota cobrada · ${money(netoDueno(p, q))} para ${duenoDe(p)}`
             : `Cobraste ${money(netoDe(p, q))}`, era ? '' : 'pos');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function abonar(id) {
    const p = prestamos.find(x => x.id === id);
    const monto = num('#aAmount');
    if (monto <= 0) { notice('Escribí un monto mayor a cero', 'neg'); return; }
    if (monto > capital(p)) { notice('El abono no puede pasar del capital vivo', 'neg'); return; }
    const nuevo = capital(p) - monto;
    try {
        await updateDoc(doc(db, COL.prestamos, id), { currentCapital: nuevo });
        closeDialog();
        notice(nuevo <= 0 ? '¡Préstamo saldado por completo!' : `Capital baja a ${money0(nuevo)}`, 'pos');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function borrar(id) {
    const p = prestamos.find(x => x.id === id);
    const ok = await askConfirm({ title: 'Eliminar préstamo', danger: true, key: true, label: 'Eliminar',
        body: `Se borra el préstamo de <b>${esc(p.clientName)}</b> con su capital de <span class="num">${money(capital(p))}</span> y todo el calendario. No se puede deshacer.` });
    if (!ok) return;
    try { await deleteDoc(doc(db, COL.prestamos, id)); go('list'); notice('Préstamo eliminado'); }
    catch (e) { notice('No se pudo eliminar: ' + e.message, 'neg'); }
}

/* ---------------- Eventos ---------------- */
document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const { act, id, qid, v } = el.dataset;
    switch (act) {
        case 'nuevo':  dlgNuevo(); break;
        case 'abrir':  go('detail', id); break;
        case 'volver': go('list'); break;
        case 'toggle': closeDialog(); marcar(id, qid); break;
        case 'abonar': dlgAbono(id); break;
        case 'borrar': borrar(id); break;
        case 'save-new':   crear(); break;
        case 'save-abono': abonar(id); break;
        case 'a-set': $('#aAmount').value = v; $('#aAmount').focus(); break;
        case 'pick-titular': clicTitular(el); break;
    }
});

/* ---------------- Arranque ---------------- */
mountShell('Préstamos', null);
let listo = false;
function mostrar() {
    if (listo) return;
    listo = true;
    $('#boot').classList.add('hidden');
    $('#app').classList.remove('hidden');
    saludo();
    history.replaceState({ view: 'list', id: null }, '');
    render();
}
bootShell({ onReady: () => {
    onSnapshot(query(collection(db, COL.prestamos)), (snap) => {
        prestamos = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        mostrar(); render();
    }, (err) => { mostrar(); notice('Sin conexión con la nube', 'neg'); console.error(err); });
}});
</script>
