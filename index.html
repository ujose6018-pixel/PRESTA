<!-- Red de seguridad: script clásico, corre aunque el módulo falle al cargar. -->
<script>
(function () {
    var mostrado = false;
    function caer(detalle) {
        if (mostrado) return;
        var b = document.getElementById('boot');
        if (!b || b.classList.contains('hidden')) return;
        mostrado = true;
        b.innerHTML =
            '<div style="max-width:340px;padding:24px;text-align:center">' +
            '<p style="font-size:17px;font-weight:600;margin-bottom:8px">No se pudo cargar la página</p>' +
            '<p style="font-size:13.5px;line-height:1.6;color:#878D98;margin-bottom:18px">' +
            'Revisá tu conexión y volvé a intentar. Si sigue igual, cerrá la aplicación y abrila de nuevo.</p>' +
            '<button onclick="location.reload()" style="padding:10px 20px;border-radius:7px;border:0;' +
            'background:#C41E30;color:#fff;font-weight:600;font-size:14px;cursor:pointer">Reintentar</button>' +
            '<p style="font-size:11px;color:#878D98;margin-top:16px;word-break:break-word;font-family:monospace">' +
            String(detalle || '').slice(0, 160) + '</p></div>';
    }
    window.addEventListener('error', function (e) {
        caer(e.message || (e.target && e.target.src) || 'error');
    }, true);
    window.addEventListener('unhandledrejection', function (e) { caer(e.reason); });
    setTimeout(function () { caer('La carga tardó demasiado'); }, 15000);
})();
</script>

<script type="module">
import { db, COL, leerCacheCripto, bottomNav, collection, doc, addDoc, onSnapshot, updateDoc, query, arrayUnion,
         $, esc, uid, money, money0, monogram, tint, notice, openDialog, closeDialog, askConfirm,
         num, dialogFooter, bootShell, saludo, swapView, countUp, cuotaDue, diasEntre, flong,
         todayStr, dateToISO, LUGARES, rondaInfo, ESTADO_RONDA } from './core.js?v=10';
import { analizar } from './analisis.js?v=10';

const D = { fondos: [], metas: [], fiado: [], financiado: [], prestamos: [], rondas: [], personales: [], presupuesto: {}, cotCripto: null };
let pend = 8, listo = false;

/* ---------------- Métricas por módulo ---------------- */
const movs = (f) => Array.isArray(f?.movements) ? f.movements : [];
const saldoFondo = (f) => movs(f).reduce((a, m) => a + (m.type === 'out' ? -Number(m.amount || 0) : Number(m.amount || 0)), 0);
const totalAhorro = () => D.fondos.reduce((a, f) => a + saldoFondo(f), 0)
    + D.metas.reduce((a, p) => a + (p.type === 'challenge'
        ? (p.savedItems || []).reduce((x, n) => x + Number(n), 0)
        : (p.deposits || []).reduce((x, d) => x + Number(d.amount || 0), 0)), 0);

const deudaFiado = () => D.fiado.reduce((a, c) =>
    a + (c.entries || []).reduce((x, e) => x + (e.type === 'payment' ? -Number(e.amount || 0) : Number(e.amount || 0)), 0), 0);

const nC = (i) => Number(i.installments) || 1;
const mC = (i) => Number(i.installmentAmount) || (Number(i.total) || 0) / nC(i);
const pd = (i) => Array.isArray(i.paid) ? i.paid : [];
const fin = (i) => pd(i).length >= nC(i);
const restaFinanciado = () => D.financiado.filter(i => !fin(i))
    .reduce((a, i) => a + Math.max(0, (Number(i.total) || 0) - pd(i).reduce((x, p) => x + Number(p.amount || mC(i)), 0)), 0);

function alertasCuotas() {
    const out = [];
    D.financiado.filter(i => !fin(i)).forEach(i => {
        for (let n = 1; n <= nC(i); n++) {
            if (pd(i).some(p => Number(p.n) === n)) continue;
            const dias = diasEntre(new Date(), cuotaDue(i, n));
            if (dias <= 5) out.push({ i, n, dias, due: cuotaDue(i, n) });
            break;
        }
    });
    return out.sort((a, b) => a.dias - b.dias);
}

/* El motor de análisis ya calcula la cartera; aquí solo se muestra. */

const textoDias = (d) => d < 0 ? `vencida hace ${Math.abs(d)} d` : d === 0 ? 'vence hoy' : d === 1 ? 'mañana' : `en ${d} días`;

/* ---------------- Panel ---------------- */
function render() {
    D.cotCripto = leerCacheCripto();   // precios que dejó la pantalla de Cripto
    const R = analizar(D);
    const c = R.cifras;
    const al = alertasCuotas();
    const ahorro = totalAhorro(), fiadoD = deudaFiado(), finD = restaFinanciado();

    const ICO = {
        ahorro:  '<path d="M3 6h18v13H3z"/><path d="M3 10h18M7 15h3"/>',
        fiado:   '<path d="M3 6h13a2 2 0 0 1 2 2v1"/><path d="M18 9h3v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6"/><circle cx="16.5" cy="14" r="1.2"/>',
        fin:     '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
        presta:  '<path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
        ronda:   '<circle cx="9" cy="7.5" r="3"/><path d="M3 20v-1.5A4.5 4.5 0 0 1 7.5 14h3a4.5 4.5 0 0 1 4.5 4.5V20"/><path d="M16.5 4.6a3 3 0 0 1 0 5.8M21 20v-1.5a4.5 4.5 0 0 0-3-4.2"/>',
        presu:   '<path d="M3 3v18h18"/><path d="m7 14 3-4 3 3 5-6"/>',
        analisis:'<path d="M12 2a10 10 0 1 0 10 10h-10Z"/><path d="M12 2a10 10 0 0 1 10 10"/>'
    };
    const tile = (href, ico, name, val, sub, col = 'var(--brand-text)', bg = 'var(--brand-soft)', alerta = false) => `
        <a href="${href}" class="tile" ${alerta ? 'style="border-color:var(--neg)"' : ''}>
            ${alerta ? `<span class="tile-badge" style="background:var(--neg);color:#fff">!</span>` : ''}
            <span class="tile-ico" style="background:${bg}">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ico}</svg>
            </span>
            <span class="tile-name">${name}</span>
            <span class="tile-val" style="color:${col}">${val}</span>
            <span class="tile-sub">${sub}</span>
        </a>`;

    swapView($('#v'), `
        ${c.cuotasVencidasP > 0 ? `
        <div>
            <p class="sec-title">Cobros atrasados</p>
            <section class="gcard">
                <a class="grow grow-hi" href="presta.html" style="text-decoration:none;color:inherit;border-left:3px solid var(--accent)">
                    <span class="mono-tile" style="background:var(--brand-soft);color:var(--accent)"><span class="dot-pulse"></span></span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-[14.5px] font-semibold">${c.cuotasVencidasP} cuota${c.cuotasVencidasP === 1 ? '' : 's'} sin cobrar</span>
                        <span class="block text-[12px] mt-0.5" style="color:var(--ink-3)">${money0(c.capitalEnMora)} con quien no paga al día</span>
                    </span>
                    <svg class="grow-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
                </a>
            </section>
        </div>` : ''}

        ${al.length ? `
        <div>
            <p class="sec-title">Pendiente de pago</p>
            <section class="gcard">
                ${al.slice(0, 3).map(a => `<a class="grow ${a.dias < 0 ? '' : ''}" href="financiacion.html" style="text-decoration:none;color:inherit;${a.dias < 0 ? 'border-left:3px solid var(--neg)' : 'border-left:3px solid #C99A3B'}">
                    <span class="mono-tile" style="background:${a.dias < 0 ? 'var(--neg-soft)' : '#FFF4E0'};color:${a.dias < 0 ? 'var(--neg)' : '#8A5A1E'}"><span class="dot-pulse"></span></span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-[14.5px] font-semibold truncate">${esc(a.i.name)}</span>
                        <span class="block text-[12px] mt-0.5" style="color:var(--ink-3)">Cuota ${a.n} de ${nC(a.i)} · ${textoDias(a.dias)}</span>
                    </span>
                    <span class="num text-[15px]">${money(mC(a.i))}</span>
                </a>`).join('')}
            </section>
        </div>` : ''}

        <section class="gcard hero">
            <div class="px-5 pt-5 pb-5">
                <p class="tag">Patrimonio neto</p>
                <p class="num text-[38px] leading-[1.1] mt-1.5" id="hero">L 0.00</p>
                <p class="text-[12.5px] mt-1.5 font-semibold" style="opacity:.75">
                    ${c.ingresos > 0 ? `Ingresos del mes: ${money(c.ingresos)}` : 'Efectivo más lo que me deben, menos lo que debo'}
                </p>

                <div class="hero-actions">
                    <button class="hero-btn" data-act="mov" data-type="in">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                        Ingreso
                    </button>
                    <button class="hero-btn" data-act="mov" data-type="out" ${D.fondos.length ? '' : 'disabled'}>
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>
                        Gasto
                    </button>
                </div>

                ${(() => {
                    const T = ahorro + c.capitalPrestado + c.deudaTotal;
                    if (T <= 0) return '';
                    const w = (v) => (v / T * 100).toFixed(1) + '%';
                    return `<div class="stack mt-5 mb-3">
                        ${ahorro > 0 ? `<i style="width:${w(ahorro)};background:#8BF0C0"></i>` : ''}
                        ${c.capitalPrestado > 0 ? `<i style="width:${w(c.capitalPrestado)};background:#FFE08A"></i>` : ''}
                        ${c.deudaTotal > 0 ? `<i style="width:${w(c.deudaTotal)};background:#FFB3B9"></i>` : ''}
                    </div>
                    <div class="legend" style="color:rgba(255,255,255,.85)">
                        ${ahorro > 0 ? `<span style="color:inherit"><i style="background:#8BF0C0"></i>Tengo ${money0(ahorro)}</span>` : ''}
                        ${c.capitalPrestado > 0 ? `<span style="color:inherit"><i style="background:#FFE08A"></i>Me deben ${money0(c.capitalPrestado)}</span>` : ''}
                        ${c.deudaTotal > 0 ? `<span style="color:inherit"><i style="background:#FFB3B9"></i>Debo ${money0(c.deudaTotal)}</span>` : ''}
                    </div>`;
                })()}
            </div>
        </section>

        <div class="statpair">
            <a class="stat" href="financiacion.html">
                <span class="stat-ico" style="background:var(--neg-soft)">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--neg)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 14.5h4"/></svg>
                </span>
                <span class="stat-name">Deudas</span>
                <span class="stat-val" style="color:${c.deudaTotal > 0 ? 'var(--neg)' : 'var(--ink)'}">${money(c.deudaTotal)}</span>
                ${c.deudaPersonal > 0 ? `<span class="text-[11.5px] font-bold mt-1 block" style="color:var(--ink-3)">${money0(c.deudaPersonal)} personal</span>` : ''}
            </a>
            <a class="stat" href="ahorro.html">
                <span class="stat-ico" style="background:var(--pos-soft)">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--pos)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 10.5c0-3.3-2.9-6-6.5-6S5.5 7.2 5.5 10.5c0 1.7.8 3.2 2 4.3V19h2.5v-1.6c.8.2 1.6.3 2.5.3s1.7-.1 2.5-.3V19H17.5v-4.2c1-1.1 1-2.6 1-4.3Z"/><circle cx="15.5" cy="10" r=".9" fill="var(--pos)"/></svg>
                </span>
                <span class="stat-name">Ahorros</span>
                <span class="stat-val pos">${money(ahorro)}</span>
                ${c.criptoLps > 0 ? `<span class="text-[11.5px] font-bold mt-1 block" style="color:var(--ink-3)">+ ${money0(c.criptoLps)} cripto</span>` : ''}
            </a>
        </div>

        ${c.interesMensual > 0 ? `
        <a class="gcard" href="presta.html" style="text-decoration:none;color:inherit;display:block">
            <div class="px-5 py-4 flex items-center gap-3">
                <span class="passive">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                    ${money0(c.interesMensual)}/mes
                </span>
                <span class="flex-1 text-[13px] font-semibold" style="color:var(--ink-2)">
                    Interés de ${c.nPrestamos} préstamo${c.nPrestamos === 1 ? '' : 's'}
                </span>
                <svg class="grow-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
            </div>
        </a>` : ''}

        ${c.administraAlgo ? `
        <a class="gcard" href="${c.capitalAdministrado > 0 ? 'presta.html' : 'fiado.html'}" style="text-decoration:none;color:inherit;display:block">
            <div class="px-5 py-4 flex items-center gap-3.5">
                <span class="mono-tile" style="background:var(--accent-soft);color:var(--accent)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20v-1.2A4.3 4.3 0 0 1 6.8 14.5h4.4a4.3 4.3 0 0 1 4.3 4.3V20"/><path d="M17.5 5.4a3 3 0 0 1 0 5.8"/></svg>
                </span>
                <span class="flex-1 min-w-0">
                    <span class="block text-[15px] font-extrabold">Administro para otros</span>
                    <span class="block text-[12.5px] mt-0.5" style="color:var(--ink-3)">
                        ${money0(c.capitalAdministrado + c.fiadoAjeno)} · fuera de tus números
                    </span>
                </span>
                ${c.vencidasAjenas > 0 ? `<span class="badge" style="background:var(--neg-soft);color:var(--neg)">${c.vencidasAjenas}</span>` : ''}
                <svg class="grow-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
            </div>
        </a>` : ''}

        <a class="gcard" href="analisis.html" style="text-decoration:none;color:inherit;display:block">
            <div class="px-5 py-4 flex items-center gap-3.5">
                <span class="mono-tile" style="background:var(--brand-soft);color:var(--brand-text)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5H12Z" fill="currentColor" stroke="none"/></svg>
                </span>
                <span class="flex-1 min-w-0">
                    <span class="block text-[15px] font-extrabold">Salud financiera</span>
                    <span class="block text-[12.5px] mt-0.5" style="color:var(--ink-3)">${esc(R.nivel.txt)} · ${R.total} de 100</span>
                </span>
                <svg class="grow-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
            </div>
        </a>

        <div>
            <p class="sec-title">Módulos</p>
            <div class="tiles">
                ${tile('ahorro.html', ICO.ahorro, 'Ahorros', money0(ahorro),
                       D.fondos.length ? `${D.fondos.length} fondo${D.fondos.length === 1 ? '' : 's'}` : 'Sin fondos', 'var(--pos)', 'var(--pos-soft)')}
                ${tile('fiado.html', ICO.fiado, 'Fiado', money0(fiadoD),
                       fiadoD > 0 ? `en ${D.fiado.filter(x => (x.entries||[]).length).length || D.fiado.length} lugar${D.fiado.length === 1 ? '' : 'es'}` : 'Al día',
                       fiadoD > 0 ? 'var(--neg)' : 'var(--pos)', fiadoD > 0 ? 'var(--neg-soft)' : 'var(--pos-soft)')}
                ${tile('financiacion.html', ICO.fin, 'Financiación', money0(finD),
                       al.length ? `${al.length} cuota${al.length === 1 ? '' : 's'} por pagar` : (finD > 0 ? 'todo al día' : 'Sin cuotas'),
                       finD > 0 ? 'var(--neg)' : 'var(--pos)', finD > 0 ? 'var(--neg-soft)' : 'var(--pos-soft)', al.some(a => a.dias < 0))}
                ${tile('presupuesto.html', ICO.presu, 'Ingresos y gastos',
                       c.ingresos || c.gastos ? money0(c.disponible) : '—',
                       c.ingresos || c.gastos ? 'me queda al mes' : 'Sin registrar',
                       c.disponible >= 0 ? 'var(--pos)' : 'var(--neg)', c.disponible >= 0 ? 'var(--pos-soft)' : 'var(--neg-soft)')}
                ${tile('presta.html', ICO.presta, 'Préstamos', c.capitalPrestado > 0 ? money0(c.capitalPrestado) : '—',
                       c.capitalPrestado > 0 ? `+${money0(c.interesMensual)}/mes de interés`
                       : c.capitalAdministrado > 0 ? `${money0(c.capitalAdministrado)} de otros` : 'Sin préstamos',
                       'var(--accent)', 'var(--brand-soft)', c.cuotasVencidasP > 0)}
                ${(() => {
                    const neto = c.ahorroRondas - c.deudaRondas;
                    const nAct = c.nRondasAhorro + c.nRondasDeuda;
                    return tile('ronda.html', ICO.ronda, 'Rondas',
                        nAct ? (neto < 0 ? '−' : '') + money0(Math.abs(neto)) : '—',
                        nAct ? `${c.nRondasAhorro ? `${c.nRondasAhorro} ahorrando` : ''}${c.nRondasAhorro && c.nRondasDeuda ? ' · ' : ''}${c.nRondasDeuda ? `${c.nRondasDeuda} en pago` : ''}` : 'Sin rondas',
                        neto < 0 ? 'var(--neg)' : neto > 0 ? 'var(--pos)' : 'var(--brand-text)',
                        neto < 0 ? 'var(--neg-soft)' : neto > 0 ? 'var(--pos-soft)' : 'var(--brand-soft)',
                        c.rondasAtrasadas > 0);
                })()}
            </div>
        </div>
    `);
    countUp($('#hero'), c.patrimonio);
    $('#greet-sub').textContent =
          c.cuotasVencidasP > 0 ? `${c.cuotasVencidasP} cuota${c.cuotasVencidasP === 1 ? '' : 's'} sin cobrar`
        : al.length ? `Tienes ${al.length} cuota${al.length === 1 ? '' : 's'} por pagar`
        : c.interesMensual > 0 ? `Ganas ${money0(c.interesMensual)} al mes en intereses`
        : c.deudaTotal > 0 ? `Debes ${money0(c.deudaTotal)} en total` : 'Todo al día';
}


/* ============================================================
   Ingresos y retiros desde el panel
   Escribe en la misma colección de fondos que usa Ahorros.
   ============================================================ */
const movsF   = (f) => Array.isArray(f?.movements) ? f.movements : [];
const saldoDe = (f) => movsF(f).reduce((a, m) => a + (m.type === 'out' ? -Number(m.amount || 0) : Number(m.amount || 0)), 0);
const CATS = { in: ['Sueldo','Negocio','Extra','Devolución','Regalo','Otro'],
               out:['Emergencia','Compra','Deuda','Comida','Transporte','Otro'] };

/** Paso 1: elegir el fondo (o crear uno si es ingreso y no hay). */
function dlgElegirFondo(tipo) {
    const lista = tipo === 'out' ? D.fondos.filter(f => saldoDe(f) > 0) : D.fondos;
    if (tipo === 'out' && !lista.length) { notice('No tenés fondos con saldo para retirar', 'neg'); return; }
    if (tipo === 'in' && !D.fondos.length) return dlgNuevoFondo();
    if (lista.length === 1) return dlgMovimiento(lista[0].id, tipo);
    openDialog(`
    <h2 class="text-[17px] font-semibold mb-1">${tipo === 'in' ? 'Registrar ingreso' : 'Registrar retiro'}</h2>
    <p class="text-[13px] mb-4" style="color:var(--ink-3)">${tipo === 'in' ? '¿A qué fondo entra?' : '¿De qué fondo sale?'}</p>
    <div style="border:1px solid var(--rule);border-radius:10px;overflow:hidden">
        ${lista.map(f => {
            const L = LUGARES[f.place] || LUGARES.efectivo;
            return `<button class="grow" data-act="pick-fondo" data-id="${f.id}" data-type="${tipo}">
                <span class="mono-tile" style="background:${tint(L.color, .12)};color:${L.color}">${esc(monogram(f.name))}</span>
                <span class="flex-1 min-w-0">
                    <span class="block text-[14.5px] font-semibold truncate">${esc(f.name)}</span>
                    <span class="block text-[11.5px]" style="color:var(--ink-3)">${L.label}</span>
                </span>
                <span class="num text-[14.5px]">${money(saldoDe(f))}</span>
            </button>`;
        }).join('')}
    </div>
    ${tipo === 'in' ? `<button class="btn btn-outline btn-block mt-3" data-act="nuevo-fondo">+ Crear un fondo nuevo</button>` : ''}`);
}

function dlgNuevoFondo() {
    openDialog(`
    <h2 class="text-[17px] font-semibold mb-1">Nuevo fondo</h2>
    <p class="text-[13px] mb-5" style="color:var(--ink-3)">Después registrás el ingreso dentro de él.</p>
    <div class="space-y-4">
        <div><label class="label" for="nfName">Nombre</label>
            <input id="nfName" class="field" maxlength="40" placeholder="Ahorro general, Emergencias…" data-autofocus></div>
        <div>
            <span class="label">¿Dónde está ese dinero?</span>
            <div class="grid grid-cols-2 gap-2" id="nfPlace" data-v="efectivo">
                ${Object.entries(LUGARES).map(([k, L]) => `
                <button type="button" class="chip" style="padding:10px;text-align:left;display:flex;align-items:center;gap:9px"
                        aria-pressed="${k === 'efectivo'}" data-act="nf-place" data-v="${k}">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${L.ico}</svg>
                    <span style="min-width:0"><span style="display:block;font-weight:700;font-size:13px">${L.label}</span>
                    <span style="display:block;font-size:11px;opacity:.7;font-weight:400">${L.desc}</span></span>
                </button>`).join('')}
            </div>
        </div>
        ${dialogFooter('save-fondo', 'Crear y continuar')}
    </div>`);
}

/** Paso 2: monto, categoría, concepto y fecha. */
function dlgMovimiento(fondoId, tipo) {
    const f = D.fondos.find(x => x.id === fondoId);
    if (!f) return;
    const entra = tipo === 'in', saldo = saldoDe(f);
    openDialog(`
    <h2 class="text-[17px] font-semibold mb-1">${entra ? 'Registrar ingreso' : 'Registrar retiro'}</h2>
    <p class="text-[13px] mb-5" style="color:var(--ink-3)">${esc(f.name)} · saldo <span class="num">${money(saldo)}</span></p>
    <div class="space-y-4">
        <div>
            <label class="label" for="mvAmount">Monto</label>
            <input id="mvAmount" class="field field-num text-[19px] font-semibold" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" data-autofocus>
            <div class="flex flex-wrap gap-1.5 mt-2">
                ${[100, 500, 1000, 5000].map(v => `<button type="button" class="chip" data-act="mv-set" data-v="${v}">${v.toLocaleString('es-HN')}</button>`).join('')}
                ${!entra && saldo > 0 ? `<button type="button" class="chip" data-act="mv-set" data-v="${saldo}">Todo</button>` : ''}
            </div>
        </div>
        <div>
            <span class="label">Categoría</span>
            <div class="flex flex-wrap gap-1.5" id="mvCat" data-v="${CATS[tipo][0]}">
                ${CATS[tipo].map(x => `<button type="button" class="chip" aria-pressed="${x === CATS[tipo][0]}" data-act="mv-cat" data-v="${esc(x)}">${esc(x)}</button>`).join('')}
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="label" for="mvNote">Concepto <span class="hint">— opcional</span></label>
                <input id="mvNote" class="field" maxlength="60" placeholder="${entra ? 'Quincena de julio' : 'Pago de luz'}"></div>
            <div><label class="label" for="mvDate">Fecha</label>
                <input id="mvDate" class="field" type="date" value="${todayStr()}" max="${todayStr()}"></div>
        </div>
        <div class="flex gap-2.5 justify-end pt-1">
            <button type="button" class="btn btn-outline" data-act="close-dialog">Cancelar</button>
            <button type="button" class="btn btn-primary" data-primary data-act="mv-save" data-id="${fondoId}" data-type="${tipo}">${entra ? 'Ingresar' : 'Retirar'}</button>
        </div>
    </div>`);
}

async function crearFondo() {
    const name = ($('#nfName').value || '').trim();
    if (!name) { notice('Escribí el nombre del fondo', 'neg'); return; }
    try {
        const ref = await addDoc(collection(db, COL.fondos), {
            name, color: 'azul', place: $('#nfPlace').dataset.v, goal: null,
            createdAt: new Date().toISOString(), movements: []
        });
        notice('Fondo creado', 'pos');
        setTimeout(() => dlgMovimiento(ref.id, 'in'), 260);
    } catch (e) { notice('No se pudo crear: ' + e.message, 'neg'); }
}

async function guardarMov(fondoId, tipo) {
    const amount = num('#mvAmount');
    if (amount <= 0) { notice('Escribí un monto mayor a cero', 'neg'); $('#mvAmount').focus(); return; }
    const f = D.fondos.find(x => x.id === fondoId);
    if (tipo === 'out' && amount > saldoDe(f)) {
        const ok = await askConfirm({ title: 'El retiro supera el saldo', danger: true, label: 'Registrar igual',
            body: `El fondo tiene <span class="num">${money(saldoDe(f))}</span>. Quedaría en <span class="num neg">${money(saldoDe(f) - amount)}</span>.` });
        if (!ok) return;
    }
    try {
        await updateDoc(doc(db, COL.fondos, fondoId), { movements: arrayUnion({
            id: uid(), type: tipo, amount,
            category: $('#mvCat').dataset.v || '',
            note: ($('#mvNote').value || '').trim(),
            date: dateToISO($('#mvDate').value || todayStr())
        }) });
        closeDialog();
        notice(`${tipo === 'in' ? 'Ingreso' : 'Retiro'} de ${money(amount)} registrado`, tipo === 'in' ? 'pos' : 'neg');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

/* ---------------- Ajustes ---------------- */
document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const { act, id, type, v } = el.dataset;
    switch (act) {
        case 'mov':         dlgElegirFondo(type); return;
        case 'pick-fondo':  dlgMovimiento(id, type); return;
        case 'nuevo-fondo': dlgNuevoFondo(); return;
        case 'save-fondo':  crearFondo(); return;
        case 'mv-save':     guardarMov(id, type); return;
        case 'mv-set':      $('#mvAmount').value = v; $('#mvAmount').focus(); return;
        case 'mv-cat':
            $('#mvCat').dataset.v = v;
            $('#mvCat').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
            return;
        case 'nf-place':
            $('#nfPlace').dataset.v = v;
            $('#nfPlace').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
            return;
    }
    if (el.dataset.act === 'ajustes') {
        openDialog(`
        <h2 class="text-[17px] font-semibold mb-5">Ajustes</h2>
        <div class="space-y-4">
            <div><label class="label" for="uName">Tu nombre <span class="hint">— para el saludo</span></label>
                <input id="uName" class="field" maxlength="24" value="${esc(localStorage.getItem('mf-nombre') || '')}" placeholder="Jose" data-autofocus></div>
            <div style="border:1px solid var(--rule);border-radius:10px;overflow:hidden">
                <a class="grow" href="analisis.html" style="text-decoration:none;color:inherit;border-top:0">
                    <span class="flex-1 text-[14.5px] font-semibold">Análisis y conexión con IA</span>
                    <svg class="grow-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
                </a>
                <a class="grow" href="presupuesto.html" style="text-decoration:none;color:inherit">
                    <span class="flex-1 text-[14.5px] font-semibold">Mi situación laboral</span>
                    <svg class="grow-chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
                </a>
            </div>
            <div class="flex gap-2.5 justify-end pt-1">
                <button class="btn btn-outline" data-act="close-dialog">Cerrar</button>
                <button class="btn btn-primary" data-primary data-act="save-name">Guardar</button>
            </div>
        </div>`);
    }
    if (el.dataset.act === 'save-name') {
        const v = ($('#uName').value || '').trim();
        v ? localStorage.setItem('mf-nombre', v) : localStorage.removeItem('mf-nombre');
        saludo(); closeDialog(); notice('Guardado');
    }
});

/* ---------------- Arranque ---------------- */
function mostrar() {
    if (listo) return;
    listo = true;
    if (!document.querySelector('.bnav')) document.body.insertAdjacentHTML('beforeend', bottomNav('inicio'));
    $('#boot').classList.add('hidden');
    $('#app').classList.remove('hidden');
    saludo(); render();
    const prev = localStorage.getItem('mf-visita');
    $('#last-visit').textContent = prev ? `Última visita: ${prev}` : 'Primera visita desde este dispositivo';
    localStorage.setItem('mf-visita', new Date().toLocaleString('es-HN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    $('#year').textContent = new Date().getFullYear();
}
const sub = (col, campo) => onSnapshot(query(collection(db, col)), (s) => {
    D[campo] = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (--pend <= 0) mostrar();
    if (listo) render();
}, () => { if (--pend <= 0) mostrar(); });

bootShell({ onReady: () => {
    sub(COL.fondos, 'fondos'); sub(COL.metas, 'metas'); sub(COL.fiado, 'fiado');
    sub(COL.financiado, 'financiado'); sub(COL.prestamos, 'prestamos'); sub(COL.rondas, 'rondas');
    sub(COL.personales, 'personales');
    onSnapshot(doc(db, COL.presupuesto, 'main'), (s) => {
        D.presupuesto = s.exists() ? s.data() : {};
        if (--pend <= 0) mostrar();
        if (listo) render();
    }, () => { if (--pend <= 0) mostrar(); });
    setTimeout(mostrar, 3000);
}});
</script>
</body>
</html>
