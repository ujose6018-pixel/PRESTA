<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ahorros y fondos · PrestaControl</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C41E30">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ahorros">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        body { padding-bottom: 78px; background: var(--paper); }

        /* ---- Estado de cuenta ---- */
        .stmt { width: 100%; border-collapse: collapse; }
        .stmt th {
            font-family: var(--f-mono); font-size: 10px; font-weight: 500;
            letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
            padding: 0 0 7px; border-bottom: 1px solid var(--rule-2); white-space: nowrap;
        }
        .stmt td { padding: 10px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
        .stmt tr:last-child td { border-bottom: 0; }
        .stmt .c-date { width: 52px; }
        .stmt .c-amt  { width: 86px; text-align: right; }
        .stmt .c-bal  { width: 88px; text-align: right; }
        @media (min-width: 640px) {
            .stmt .c-date { width: 92px; }
            .stmt .c-amt, .stmt .c-bal { width: 130px; }
        }
        .stmt .row-click { cursor: pointer; }
        .stmt .row-click:hover td { background: var(--sunk); }
        .stmt .band td {
            padding: 9px 0 7px; background: var(--sunk);
            border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
            font-family: var(--f-mono); font-size: 10.5px; font-weight: 500;
            letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2);
        }
        .stmt .band td:first-child { padding-left: 8px; }
        .stmt .band td:last-child { padding-right: 8px; }
        .amt { font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; }
        .bal { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .detail { font-size: 14px; font-weight: 500; }
        .detail small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 400; margin-top: 1px; }
        .date-cell { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); padding-top: 2px; }


        .kpi { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); }
        .kpi > div { padding: 13px 16px; border-right: 1px solid var(--rule); }
        .kpi > div:last-child { border-right: 0; }

        .list-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--rule); cursor: pointer; }
        .list-row:last-child { border-bottom: 0; }
        .list-row:hover { background: var(--sunk); }

        .grid-num { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 5px; }
        .nbox {
            aspect-ratio: 1; display: grid; place-items: center; cursor: pointer;
            font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums;
            background: var(--sheet); border: 1px solid var(--rule); border-radius: 5px;
            color: var(--ink-3); transition: all .12s ease;
        }
        .nbox:hover { border-color: var(--brand-text); color: var(--brand-text); }
        .nbox[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="boot" class="fixed inset-0 grid place-items-center" style="background: var(--paper); z-index: 90;">
    <p class="tag" id="boot-text">Cargando</p>
</div>

<div id="app" class="hidden">

    <header class="appbar">
        <div class="max-w-3xl mx-auto px-3 appbar-in">
            <span class="flex items-center gap-2.5 min-w-0">
                <span class="mono-tile" style="background: rgba(255,255,255,.16); color: var(--brand-ink); width: 30px; height: 30px; font-size: 11.5px;">PC</span>
                <span class="font-semibold text-[15.5px] truncate" style="font-family: var(--f-display); letter-spacing: -.01em;">PrestaControl</span>
            </span>
            <span class="flex items-center gap-1">
                <button id="theme-btn" class="appbar-btn" aria-label="Cambiar tema">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
                </button>
                <a href="index.html" class="appbar-btn" aria-label="Volver al menú principal">
                    Menú
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 16l4-4-4-4M14 12H4"/></svg>
                </a>
            </span>
        </div>
    </header>

    <div class="greet">
        <div class="max-w-3xl mx-auto px-4 greet-in">
            <span class="greet-ico" id="greet-ico"></span>
            <div class="flex-1 min-w-0">
                <p class="text-[16px] font-semibold truncate" id="greet-text">Hola</p>
                <p class="text-[12px]" style="color: var(--ink-3);" id="greet-sub"></p>
            </div>
            <button class="bell" data-act="logros" aria-label="Ver logros">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                <span class="bell-dot hidden" id="bell-dot">0</span>
            </button>
        </div>
    </div>

    <main class="max-w-3xl mx-auto px-4 py-5">
        <section id="view-home"></section>
        <section id="view-funds" class="hidden"></section>
        <section id="view-fund"  class="hidden"></section>
        <section id="view-goals" class="hidden"></section>
        <section id="view-goal"  class="hidden"></section>
        <section id="view-logros" class="hidden"></section>

        <footer class="sitefoot">
            <p id="last-visit"></p>
            <p>PrestaControl · <span id="year"></span></p>
        </footer>
    </main>

    <nav class="bnav" role="tablist">
        <button class="tab" data-tab="home" aria-current="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9.5L12 3l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/></svg>
            Inicio
        </button>
        <button class="tab" data-tab="funds" aria-current="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
            Fondos
        </button>
        <div class="slot">
            <button class="fab" data-act="fab" aria-label="Registrar movimiento">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>
            </button>
        </div>
        <button class="tab" data-tab="goals" aria-current="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 1-1h9l-1.5 3L14 10H5"/></svg>
            Metas
        </button>
        <button class="tab" data-act="more" aria-current="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            Más
        </button>
    </nav>
</div>

<div id="scrim" class="scrim" data-act="close-dialog"></div>
<div id="dialog" class="dialog" role="dialog" aria-modal="true"><div class="dialog-grip"></div><div id="dialog-body"></div></div>
<div id="notices" class="notices"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, onSnapshot, updateDoc, deleteDoc, query,
         enableIndexedDbPersistence, arrayUnion, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAnLru6yhw9huXN25LV4kGmCfXL843o4TA",
    authDomain: "presta-57302.firebaseapp.com",
    projectId: "presta-57302",
    storageBucket: "presta-57302.firebasestorage.app",
    messagingSenderId: "636802344217",
    appId: "1:636802344217:web:46fa0418609d69eb841188"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
enableIndexedDbPersistence(db).catch(() => {});

const FUNDS = 'savings_funds';
const PLANS = 'savings_plans';
const MASTER_KEY = '2026';

let funds = [], plans = [];
let route = { view: 'home', id: null };
let dialogOpen = false;
let movFilter = 'all';

const COLORS = {
    azul:    '#1F3A5F',
    verde:   '#1C6544',
    ocre:    '#8A5A1E',
    vino:    '#7B2D38',
    pizarra: '#3F4A57'
};
const CATS = {
    in:  ['Sueldo', 'Negocio', 'Extra', 'Devolución', 'Regalo', 'Otro'],
    out: ['Emergencia', 'Compra', 'Deuda', 'Comida', 'Transporte', 'Otro']
};

/* ---------------- Utilidades ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function money(n, opts = {}) {
    const v = Number(n) || 0;
    const s = Math.abs(v).toLocaleString('es-HN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const sign = opts.signed ? (v > 0 ? '+' : v < 0 ? '−' : '') : (v < 0 ? '−' : '');
    return `${sign}L ${s}`;
}
const money0 = (n) => 'L ' + Math.round(Number(n) || 0).toLocaleString('es-HN');
const monogram = (name) => {
    const w = String(name || '?').trim().split(/\s+/).filter(Boolean);
    return ((w[0]?.[0] || '?') + (w[1]?.[0] || '')).toUpperCase();
};
const tint = (hex, a) => {
    const h = hex.replace('#', '');
    return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
};

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fshort = (iso) => { const d = new Date(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; };
const flong  = (iso) => { const d = new Date(iso); return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; };
const ftime  = (iso) => new Date(iso).toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' });
const monthKey = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const monthLabel = (key) => { const [y, m] = key.split('-'); return `${MESES[+m - 1]} ${y}`; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const isoToDate = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function dateToISO(s) { return s === todayStr() ? new Date().toISOString() : new Date(s + 'T12:00:00').toISOString(); }

/* ---------------- Cálculos ---------------- */
const movs = (f) => (f && Array.isArray(f.movements)) ? f.movements : [];
const balanceOf = (f) => movs(f).reduce((a, m) => a + (m.type === 'out' ? -Number(m.amount || 0) : Number(m.amount || 0)), 0);
const colorOf = (f) => COLORS[f.color] || COLORS.azul;

function monthFlow(list, key = monthKey(new Date().toISOString())) {
    let inn = 0, out = 0;
    list.forEach(f => movs(f).forEach(m => {
        if (monthKey(m.date) !== key) return;
        if (m.type === 'out') out += Number(m.amount || 0); else inn += Number(m.amount || 0);
    }));
    return { inn, out, net: inn - out };
}

function planTotals(p) {
    if (p.type === 'challenge') {
        const start = Number(p.startNum) || 0, end = Number(p.endNum) || 0;
        const count = Math.max(0, end - start + 1);
        return { saved: (p.savedItems || []).reduce((a, b) => a + Number(b), 0), target: count > 0 ? (count * (start + end)) / 2 : 0, count };
    }
    return { saved: (p.deposits || []).reduce((a, d) => a + Number(d.amount || 0), 0), target: Number(p.targetAmount) || 0, count: 0 };
}
const totalFunds = () => funds.reduce((a, f) => a + balanceOf(f), 0);
const totalGoals = () => plans.reduce((a, p) => a + planTotals(p).saved, 0);

/* Saldo corrido: cronológico hacia adelante, luego se muestra al revés */
function withRunning(f) {
    const asc = movs(f).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
    let run = 0;
    return asc.map(m => { run += (m.type === 'out' ? -Number(m.amount || 0) : Number(m.amount || 0)); return { ...m, saldo: run }; });
}

/* ---------------- Avisos ---------------- */
function notice(msg, kind = '') {
    const el = document.createElement('div');
    el.className = `notice ${kind}`;
    el.textContent = msg;
    $('#notices').appendChild(el);
    setTimeout(() => { el.classList.add('gone'); setTimeout(() => el.remove(), 220); }, 2600);
}

/* ---------------- Diálogos ---------------- */
function openDialog(html) {
    $('#dialog-body').innerHTML = html;
    $('#dialog').classList.add('open');
    $('#scrim').classList.add('open');
    if (!dialogOpen) { dialogOpen = true; history.pushState({ dialog: true }, ''); }
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('#dialog [data-autofocus]')?.focus(), 240);
}
function closeDialog(fromPop = false) {
    if (!dialogOpen) return;
    dialogOpen = false;
    $('#dialog').classList.remove('open');
    $('#scrim').classList.remove('open');
    document.body.style.overflow = '';
    if (!fromPop && history.state && history.state.dialog) history.back();
}

function askConfirm({ title, body, label = 'Confirmar', danger = false, key = false }) {
    return new Promise(resolve => {
        openDialog(`
            <h2 class="text-[17px] font-semibold mb-2">${esc(title)}</h2>
            <p class="text-[14px] mb-5" style="color: var(--ink-2); line-height:1.6">${body}</p>
            ${key ? `<div class="mb-5"><label class="label" for="ck">Clave maestra</label><input id="ck" type="password" inputmode="numeric" class="field field-num" data-autofocus></div>` : ''}
            <div class="flex gap-2.5 justify-end">
                <button class="btn btn-outline" data-confirm="0">Cancelar</button>
                <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-confirm="1">${esc(label)}</button>
            </div>`);
        const handler = (e) => {
            const btn = e.target.closest('[data-confirm]');
            if (!btn) return;
            const ok = btn.dataset.confirm === '1';
            if (ok && key && ($('#ck')?.value || '') !== MASTER_KEY) { notice('Clave incorrecta', 'neg'); return; }
            $('#dialog').removeEventListener('click', handler);
            closeDialog();
            resolve(ok);
        };
        $('#dialog').addEventListener('click', handler);
    });
}

/* ---------------- Navegación ---------------- */
function go(view, id = null, push = true) {
    route = { view, id };
    if (push) history.pushState({ view, id }, '');
    ['home', 'funds', 'fund', 'goals', 'goal', 'logros'].forEach(v => $('#view-' + v).classList.toggle('hidden', v !== view));
    document.querySelectorAll('.tab[data-tab]').forEach(t => {
        const active = t.dataset.tab === view || (view === 'fund' && t.dataset.tab === 'funds') || (view === 'goal' && t.dataset.tab === 'goals');
        t.setAttribute('aria-current', active ? 'true' : 'false');
    });
    window.scrollTo(0, 0);
    render();
}

window.addEventListener('popstate', (e) => {
    if (dialogOpen) { closeDialog(true); return; }
    const s = e.state || { view: 'home', id: null };
    go(s.view || 'home', s.id || null, false);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && dialogOpen) closeDialog(); });

function render() {
    if (route.view === 'home')  renderHome();
    if (route.view === 'funds') renderFunds();
    if (route.view === 'fund')  renderFundDetail();
    if (route.view === 'goals') renderGoals();
    if (route.view === 'goal')  renderGoalDetail();
    if (route.view === 'logros') renderLogros();
    revisarLogros();
}

/* ============================================================
   VISTAS
   ============================================================ */
function movRow(m, opts = {}) {
    const inn = m.type !== 'out';
    const click = opts.fundId ? `class="row-click" data-act="edit-mov" data-id="${opts.fundId}" data-mid="${m.id}"` : '';
    return `<tr ${click}>
        <td class="c-date"><span class="date-cell">${fshort(m.date)}</span></td>
        <td><span class="detail">${esc(m.note || m.category || (inn ? 'Ingreso' : 'Retiro'))}
            <small>${esc(m.category || '—')}${m.fundName ? ' · ' + esc(m.fundName) : ''}</small></span></td>
        <td class="c-amt"><span class="amt ${inn ? 'pos' : 'neg'}">${inn ? '+' : '−'}${money(m.amount).replace('−', '')}</span></td>
        ${opts.saldo ? `<td class="c-bal"><span class="bal">${money(m.saldo)}</span></td>` : ''}
    </tr>`;
}

function stmtHead(saldo) {
    return `<thead><tr>
        <th class="c-date">Fecha</th><th>Detalle</th><th class="c-amt">Monto</th>
        ${saldo ? '<th class="c-bal">Saldo</th>' : ''}
    </tr></thead>`;
}

function renderHome() {
    const tf = totalFunds(), tg = totalGoals();
    const flow = monthFlow(funds);
    const mes = MESES[new Date().getMonth()];
    const L = logros();
    const ganados = L.filter(l => l.done);
    const siguientes = L.filter(l => !l.done).slice(0, 2);
    const recientes = funds.flatMap(f => movs(f).map(m => ({ ...m, fundId: f.id, fundName: funds.length > 1 ? f.name : '' })))
                           .sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);

    $('#view-home').innerHTML = `
    <div class="space-y-5">

        <div>
        <p class="sec-title">Mi dinero</p>
        <section class="gcard">
            <div class="gcard-head">
                <span class="gcard-ico">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--brand-text)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 4l9 6"/><path d="M5 10v9M19 10v9M9 10v9M15 10v9M3 20h18"/></svg>
                </span>
                <div class="min-w-0">
                    <h2 class="text-[16px] font-semibold">Posición total</h2>
                    <p class="text-[13px]" style="color: var(--ink-3);">Fondos y metas juntos</p>
                </div>
            </div>
            <div class="px-4 pb-4">
                <p class="num text-[30px] leading-none">${money(tf + tg)}</p>
                <p class="text-[12px] mt-2" style="color: var(--ink-3);">Al ${flong(new Date().toISOString())}</p>
            </div>
            <div class="kpi">
                <div><p class="tag">Fondos</p><p class="num text-[14.5px] mt-1.5">${money(tf)}</p></div>
                <div><p class="tag">Metas</p><p class="num text-[14.5px] mt-1.5">${money(tg)}</p></div>
                <div><p class="tag">Neto ${mes.slice(0, 3)}</p><p class="num text-[14.5px] mt-1.5 ${flow.net > 0 ? 'pos' : flow.net < 0 ? 'neg' : ''}">${money(flow.net, { signed: true })}</p></div>
            </div>
        </section>
        </div>

        <div>
        <p class="sec-title">Mis fondos</p>
        <section class="gcard">
            <div class="gcard-head">
                <span class="gcard-ico">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--brand-text)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a6 6 0 0 1 6-6h3a6 6 0 0 1 6 5.2l1.5 1v3.3H19a6 6 0 0 1-2 2.2V20h-3v-1.5h-3V20H8v-2.3A6 6 0 0 1 4 12Z"/><circle cx="15.5" cy="11" r=".8" fill="var(--brand-text)"/></svg>
                </span>
                <div class="min-w-0 flex-1">
                    <h2 class="text-[16px] font-semibold">Fondos</h2>
                    <p class="text-[13px]" style="color: var(--ink-3);">${funds.length ? `${funds.length} abierto${funds.length === 1 ? '' : 's'}` : 'Sin fondos abiertos'}</p>
                </div>
            </div>
            ${funds.length ? funds.slice(0, 4).map(f => gRowFund(f)).join('') + `
                ${funds.length > 4 ? `<div class="gfoot"><button class="text-[13.5px] font-semibold" data-act="tab-funds" style="color: var(--brand-text);">Ver los ${funds.length} fondos</button></div>` : ''}` : `
                <div class="px-4 pb-4 pt-1">
                    <p class="text-[13.5px] mb-4" style="color: var(--ink-2); line-height:1.6;">Un fondo es una bolsa con saldo propio: registras lo que entra y lo que sale, y cada movimiento queda con el saldo que dejó.</p>
                    <button class="btn btn-primary" data-act="new-fund">Abrir mi primer fondo</button>

    const c = colorOf(f), bal = balanceOf(f);

        <span class="mono-tile" style="background:${tint(c, .1)}; color:${c};">${esc(monogram(f.name))}</span>

};

const mesSiguiente = (a, b) => {
    const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
    return (yb * 12 + mb) - (ya * 12 + ma) === 1;
};

function netoPorMes() {
    const net = {};
    funds.forEach(f => movs(f).forEach(m => {
        const k = monthKey(m.date);
        net[k] = (net[k] || 0) + (m.type === 'out' ? -Number(m.amount || 0) : Number(m.amount || 0));
    }));
    return net;
}

function logros() {
    const all = funds.flatMap(f => movs(f));
    const total = totalFunds() + totalGoals();
    const dias = new Set(all.map(m => isoToDate(m.date))).size;

    const net = netoPorMes();
    const claves = Object.keys(net).sort();
    let racha = 0, mejorRacha = 0, prev = null;
    claves.forEach(k => {
        racha = net[k] > 0 ? ((prev && mesSiguiente(prev, k)) ? racha + 1 : 1) : 0;
        mejorRacha = Math.max(mejorRacha, racha);
        prev = k;
    });
    const verdes = Object.values(net).filter(v => v > 0).length;

    const cumplidas = funds.filter(f => f.goal && balanceOf(f) >= Number(f.goal)).length
                    + plans.filter(p => { const t = planTotals(p); return t.target > 0 && t.saved >= t.target; }).length;

    const salidas = all.filter(m => m.type === 'out').map(m => new Date(m.date).getTime());
    const todas = all.map(m => new Date(m.date).getTime());
    const desde = salidas.length ? Math.max(...salidas) : (todas.length ? Math.min(...todas) : null);
    const sinRetiro = desde ? Math.max(0, Math.floor((Date.now() - desde) / 86400000)) : 0;

    const def = [
        { id: 'inicio',    name: 'Primer registro',       desc: 'Anota tu primer movimiento',        cur: all.length,  goal: 1,     icon: ICONS.libreta },
        { id: 'mil',       name: 'El primer millar',      desc: 'Junta L 1,000 entre todo',          cur: total,       goal: 1000,  icon: ICONS.moneda, money: true },
        { id: 'bolsas',    name: 'Cada cosa en su bolsa', desc: 'Ten 3 fondos abiertos',             cur: funds.length, goal: 3,    icon: ICONS.bolsas },
        { id: 'libreta25', name: 'Libreta al día',        desc: 'Registra 25 movimientos',           cur: all.length,  goal: 25,    icon: ICONS.libreta },
        { id: 'verde',     name: 'Mes en verde',          desc: 'Cierra un mes con saldo a favor',   cur: verdes,      goal: 1,     icon: ICONS.calendario },
        { id: 'constancia',name: 'Constancia',            desc: 'Registra en 10 días distintos',     cur: dias,        goal: 10,    icon: ICONS.calendario },
        { id: 'cinco',     name: 'Cinco mil',             desc: 'Junta L 5,000 entre todo',          cur: total,       goal: 5000,  icon: ICONS.moneda, money: true },
        { id: 'meta',      name: 'Meta cumplida',         desc: 'Completa una meta o un fondo con objetivo', cur: cumplidas, goal: 1, icon: ICONS.trofeo },
        { id: 'quieta',    name: 'Mano quieta',           desc: '30 días seguidos sin retirar',      cur: sinRetiro,   goal: 30,    icon: ICONS.mano },
        { id: 'racha3',    name: 'Racha de tres',         desc: 'Tres meses seguidos en verde',      cur: mejorRacha,  goal: 3,     icon: ICONS.racha },
        { id: 'libreta100',name: 'Cuentas de la casa',    desc: 'Registra 100 movimientos',          cur: all.length,  goal: 100,   icon: ICONS.libreta },
        { id: 'veinticinco', name: 'Veinticinco mil',     desc: 'Junta L 25,000 entre todo',         cur: total,       goal: 25000, icon: ICONS.moneda, money: true },
        { id: 'racha6',    name: 'Medio año en verde',    desc: 'Seis meses seguidos en verde',      cur: mejorRacha,  goal: 6,     icon: ICONS.racha },
        { id: 'cincuenta', name: 'Cincuenta mil',         desc: 'Junta L 50,000 entre todo',         cur: total,       goal: 50000, icon: ICONS.moneda, money: true }
    ];
    return def.map(l => ({ ...l, done: l.cur >= l.goal, pct: Math.min(100, (l.cur / l.goal) * 100) }));
}

/* Revisa si hay logros nuevos y avisa */
function revisarLogros() {
    const L = logros();
    const ganados = leer(K_LOGROS);
    const vistos = leer(K_VISTOS);
    const primeraVez = localStorage.getItem(K_LOGROS) === null;
    const nuevos = [];

    L.forEach(l => {
        if (l.done && !ganados[l.id]) {
            ganados[l.id] = new Date().toISOString();
            if (primeraVez) vistos[l.id] = true; else nuevos.push(l);
        }
    });
    guardar(K_LOGROS, ganados);
    guardar(K_VISTOS, vistos);

    const pendientes = Object.keys(ganados).filter(id => !vistos[id]).length;
    const dot = $('#bell-dot');
    if (dot) { dot.textContent = pendientes; dot.classList.toggle('hidden', pendientes === 0); }

    if (nuevos.length && !dialogOpen) {
        const l = nuevos[0];
        openDialog(`
            <div class="text-center py-2">
                <span class="medal medal-on mx-auto mb-4" style="width:64px;height:64px;">${l.icon}</span>
                <p class="tag mb-2">Logro desbloqueado</p>
                <h2 class="text-[19px] font-semibold mb-1.5">${esc(l.name)}</h2>
                <p class="text-[13.5px] mb-6" style="color: var(--ink-2);">${esc(l.desc)}</p>
                <button class="btn btn-primary btn-block" data-act="close-dialog">Seguir</button>
            </div>`);
        if (nuevos.length > 1) notice(`Y ${nuevos.length - 1} logro${nuevos.length > 2 ? 's' : ''} más`, 'pos');
    }
}

function renderLogros() {
    const L = logros();
    const ganados = leer(K_LOGROS);
    guardar(K_VISTOS, Object.fromEntries(Object.keys(ganados).map(id => [id, true])));
    $('#bell-dot')?.classList.add('hidden');

    const hechos = L.filter(l => l.done);
    const faltan = L.filter(l => !l.done);

    /* Últimos seis meses: verde si cerró a favor */
    const net = netoPorMes();
    const barras = [];
    for (let i = 5; i >= 0; i--) {
        const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
        const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        barras.push({ k, verde: (net[k] || 0) > 0, mes: MESES[d.getMonth()].slice(0, 3) });
    }

    const fila = (l) => `
        <div class="ach ${l.done ? '' : 'ach-locked'}">
            <span class="medal ${l.done ? 'medal-on' : 'medal-off'}">${l.icon}</span>
            <span class="flex-1 min-w-0">
                <span class="block text-[14.5px] font-semibold ach-name">${esc(l.name)}</span>
                <span class="block text-[12.5px]" style="color: var(--ink-3);">${esc(l.desc)}</span>
                ${l.done ? `<span class="block text-[11.5px] num mt-1" style="color: var(--ink-3);">Desbloqueado el ${ganados[l.id] ? isoToDate(ganados[l.id]).split('-').reverse().join('/') : '—'}</span>`
                         : `<span class="meter block mt-2" style="max-width:200px"><i style="width:${l.pct}%"></i></span>`}
            </span>
            ${l.done ? '' : `<span class="num text-[12px] flex-none" style="color: var(--ink-3);">${l.money ? money0(l.cur) : l.cur}/${l.money ? money0(l.goal) : l.goal}</span>`}
        </div>`;

    $('#view-logros').innerHTML = `
    <div class="space-y-4">
        <section class="gcard">
            <div class="gcard-head">
                <span class="gcard-ico">${ICONS.trofeo}</span>
                <div class="min-w-0 flex-1">
                    <h2 class="text-[16px] font-semibold">Logros</h2>
                    <p class="text-[13px]" style="color: var(--ink-3);">${hechos.length} de ${L.length} desbloqueados</p>
                </div>
                <span class="num text-[19px]" style="color: var(--brand-text);">${Math.round(hechos.length / L.length * 100)}%</span>
            </div>
            <div class="px-4 pb-4">
                <div class="meter mb-5"><i style="width:${hechos.length / L.length * 100}%"></i></div>
                <p class="tag mb-2">Últimos seis meses</p>
                <div class="grid grid-cols-6 gap-1.5">
                    ${barras.map(b => `<div>
                        <span class="block" style="height:26px; border-radius:4px; background:${b.verde ? 'var(--pos)' : 'var(--rule)'}"></span>
                        <span class="block text-center text-[10px] mt-1" style="color: var(--ink-3);">${b.mes}</span>
                    </div>`).join('')}
                </div>
                <p class="text-[12px] mt-3" style="color: var(--ink-3);">Un mes se pinta cuando entró más de lo que salió.</p>
            </div>
        </section>

        ${hechos.length ? `<section class="gcard">
            <div class="gcard-head"><div><h2 class="text-[15px] font-semibold">Desbloqueados</h2></div></div>
            <div style="border-top: 1px solid var(--rule);">${hechos.map(fila).join('')}</div>
        </section>` : ''}

        ${faltan.length ? `<section class="gcard">
            <div class="gcard-head"><div><h2 class="text-[15px] font-semibold">En progreso</h2></div></div>
            <div style="border-top: 1px solid var(--rule);">${faltan.map(fila).join('')}</div>
        </section>` : ''}
    </div>`;
}

            <input id="dAmount" class="field field-num text-[19px] font-semibold" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" data-autofocus>

                ${[100, 500, 1000, 2000].map(v => `<button type="button" class="chip" data-act="set-amount-d" data-v="${v}">${v.toLocaleString('es-HN')}</button>`).join('')}
            </div>
        </div>
        ${footerBtns('save-deposit', 'Abonar', planId)}
    </div>`);
}

function pickFund(type) {
    if (funds.length === 0) return dialogFund();
    if (funds.length === 1) return dialogMovement(funds[0].id, type);
    openDialog(`
    <h2 class="text-[17px] font-semibold mb-1">${type === 'in' ? 'Registrar ingreso' : 'Registrar retiro'}</h2>
    <p class="text-[13px] mb-4" style="color: var(--ink-3);">Elige el fondo</p>
    <div style="border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden;">
        ${funds.map(f => {
            const c = colorOf(f);
            return `<div class="list-row" data-act="mov" data-id="${f.id}" data-type="${type}">
                <span class="mono-tile" style="background:${tint(c, .1)}; color:${c};">${esc(monogram(f.name))}</span>
                <span class="flex-1 min-w-0 text-[14.5px] font-semibold truncate">${esc(f.name)}</span>
                <span class="num text-[14.5px]">${money(balanceOf(f))}</span>
            </div>`;
        }).join('')}
    </div>`);
}

/* ============================================================
   ESCRITURAS
   ============================================================ */
const num = (sel) => { const v = parseFloat(($(sel)?.value || '').replace(',', '.')); return isNaN(v) ? 0 : v; };

async function createFund() {
    const name = ($('#fName').value || '').trim();
    if (!name) { notice('Escribe el nombre del fondo', 'neg'); $('#fName').focus(); return; }
    const inicial = num('#fStart'), goal = num('#fGoal');
    const data = {
        name, color: $('#fColor').dataset.v, goal: goal > 0 ? goal : null,
        createdAt: new Date().toISOString(),
        movements: inicial !== 0 ? [{ id: uid(), type: inicial > 0 ? 'in' : 'out', amount: Math.abs(inicial), category: 'Saldo inicial', note: 'Saldo inicial', date: new Date().toISOString() }] : []
    };
    try {
        const ref = await addDoc(collection(db, FUNDS), data);
        closeDialog(); notice('Fondo creado', 'pos'); go('fund', ref.id);
    } catch (e) { notice('No se pudo crear: ' + e.message, 'neg'); }
}

async function saveFundEdit(id) {
    const name = ($('#fName').value || '').trim();
    if (!name) { notice('Escribe el nombre del fondo', 'neg'); return; }
    const goal = num('#fGoal');
    try {
        await updateDoc(doc(db, FUNDS, id), { name, color: $('#fColor').dataset.v, goal: goal > 0 ? goal : null });
        closeDialog(); notice('Fondo actualizado');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function saveMovement(fundId, type) {
    const f = funds.find(x => x.id === fundId);
    const amount = num('#mAmount');
    if (amount <= 0) { notice('Escribe un monto mayor a cero', 'neg'); $('#mAmount').focus(); return; }

    if (type === 'out') {
        const saldo = balanceOf(f);
        if (amount > saldo) {
            const ok = await askConfirm({
                title: 'El retiro supera el saldo', danger: true, label: 'Registrar igual',
                body: `El fondo tiene <span class="num">${money(saldo)}</span> y vas a retirar <span class="num">${money(amount)}</span>. Quedaría en <span class="num neg">${money(saldo - amount)}</span>.`
            });
            if (!ok) return;
        }
    }
    const mov = {
        id: uid(), type, amount,
        category: $('#mCat').dataset.v || '',
        note: ($('#mNote').value || '').trim(),
        date: dateToISO($('#mDate').value || todayStr())
    };
    try {
        await updateDoc(doc(db, FUNDS, fundId), { movements: arrayUnion(mov) });
        closeDialog();
        notice(`${type === 'in' ? 'Ingreso' : 'Retiro'} de ${money(amount)} registrado`, type === 'in' ? 'pos' : 'neg');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function updateMovement(fundId, movId) {
    const f = funds.find(x => x.id === fundId);
    const amount = num('#mAmount');
    if (amount <= 0) { notice('Escribe un monto mayor a cero', 'neg'); return; }
    const list = movs(f).map(m => m.id === movId ? {
        ...m, amount, type: $('#mType').dataset.v,
        category: $('#mCat').dataset.v || '',
        note: ($('#mNote').value || '').trim(),
        date: dateToISO($('#mDate').value)
    } : m);
    try {
        await updateDoc(doc(db, FUNDS, fundId), { movements: list });
        closeDialog(); notice('Movimiento corregido');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function deleteMovement(fundId, movId) {
    const ok = await askConfirm({ title: 'Borrar movimiento', danger: true, label: 'Borrar',
        body: 'El saldo del fondo se recalcula sin este movimiento.' });
    if (!ok) return;
    const f = funds.find(x => x.id === fundId);
    try {
        await updateDoc(doc(db, FUNDS, fundId), { movements: movs(f).filter(m => m.id !== movId) });
        notice('Movimiento borrado');
    } catch (e) { notice('No se pudo borrar: ' + e.message, 'neg'); }
}

async function saveTransfer() {
    const fromId = $('#tFrom').value, toId = $('#tTo').value, amount = num('#tAmount');
    if (fromId === toId) { notice('Elige dos fondos distintos', 'neg'); return; }
    if (amount <= 0) { notice('Escribe un monto mayor a cero', 'neg'); return; }
    const from = funds.find(f => f.id === fromId), to = funds.find(f => f.id === toId);
    if (amount > balanceOf(from)) {
        const ok = await askConfirm({
            title: 'El traspaso supera el saldo', danger: true, label: 'Traspasar igual',
            body: `${esc(from.name)} tiene <span class="num">${money(balanceOf(from))}</span> y quedaría en <span class="num neg">${money(balanceOf(from) - amount)}</span>.`
        });
        if (!ok) return;
    }
    const tid = uid(), date = new Date().toISOString();
    try {
        const batch = writeBatch(db);
        batch.update(doc(db, FUNDS, fromId), { movements: arrayUnion({ id: uid(), type: 'out', amount, category: 'Traspaso', note: `Hacia ${to.name}`, date, transferId: tid }) });
        batch.update(doc(db, FUNDS, toId),   { movements: arrayUnion({ id: uid(), type: 'in',  amount, category: 'Traspaso', note: `Desde ${from.name}`, date, transferId: tid }) });
        await batch.commit();
        closeDialog(); notice(`Traspaso de ${money(amount)} realizado`, 'pos');
    } catch (e) { notice('No se pudo traspasar: ' + e.message, 'neg'); }
}

async function deleteFund(id) {
    const f = funds.find(x => x.id === id);
    const ok = await askConfirm({
        title: 'Eliminar fondo', danger: true, key: true, label: 'Eliminar',
        body: `Se borra <b>${esc(f.name)}</b> con sus ${movs(f).length} movimientos y su saldo de <span class="num">${money(balanceOf(f))}</span>. No se puede deshacer.`
    });
    if (!ok) return;
    try { await deleteDoc(doc(db, FUNDS, id)); go('funds'); notice('Fondo eliminado'); }
    catch (e) { notice('No se pudo eliminar: ' + e.message, 'neg'); }
}

async function createGoal() {
    const name = ($('#gName').value || '').trim();
    if (!name) { notice('Escribe el nombre de la meta', 'neg'); return; }
    const type = $('#gType').dataset.v;
    const p = { name, type, createdAt: new Date().toISOString(), savedItems: [], deposits: [] };
    if (type === 'challenge') {
        p.startNum = parseInt($('#gStart').value) || 1;
        p.endNum = parseInt($('#gEnd').value) || 100;
        if (p.endNum <= p.startNum) { notice('El número final debe ser mayor', 'neg'); return; }
    } else {
        p.targetAmount = num('#gTarget');
        p.targetDate = $('#gDate').value;
        if (p.targetAmount <= 0) { notice('Escribe el monto de la meta', 'neg'); return; }
        if (!p.targetDate) { notice('Elige la fecha límite', 'neg'); return; }
    }
    try {
        const ref = await addDoc(collection(db, PLANS), p);
        closeDialog(); notice('Meta creada', 'pos'); go('goal', ref.id);
    } catch (e) { notice('No se pudo crear: ' + e.message, 'neg'); }
}

async function toggleNum(planId, n) {
    const p = plans.find(x => x.id === planId);
    const cur = (p.savedItems || []).map(Number);
    const next = cur.includes(n) ? cur.filter(x => x !== n) : [...cur, n];
    try { await updateDoc(doc(db, PLANS, planId), { savedItems: next }); }
    catch (e) { notice('No se pudo actualizar: ' + e.message, 'neg'); }
}

async function saveDeposit(planId) {
    const amount = num('#dAmount');
    if (amount <= 0) { notice('Escribe un monto mayor a cero', 'neg'); return; }
    try {
        await updateDoc(doc(db, PLANS, planId), { deposits: arrayUnion({ amount, date: new Date().toISOString() }) });
        closeDialog(); notice(`Abono de ${money(amount)} registrado`, 'pos');
    } catch (e) { notice('No se pudo guardar: ' + e.message, 'neg'); }
}

async function deleteGoal(id) {
    const p = plans.find(x => x.id === id);
    const ok = await askConfirm({ title: 'Eliminar meta', danger: true, key: true, label: 'Eliminar',
        body: `Se borra <b>${esc(p.name)}</b> y todo su progreso. No se puede deshacer.` });
    if (!ok) return;
    try { await deleteDoc(doc(db, PLANS, id)); go('goals'); notice('Meta eliminada'); }
    catch (e) { notice('No se pudo eliminar: ' + e.message, 'neg'); }
}

function exportFund(id) {
    const f = funds.find(x => x.id === id);
    const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
    const rows = [['Fecha', 'Hora', 'Tipo', 'Categoria', 'Concepto', 'Monto', 'Saldo']];
    withRunning(f).forEach(m => {
        rows.push([isoToDate(m.date), ftime(m.date), m.type === 'out' ? 'Salida' : 'Entrada', m.category || '', m.note || '',
                   (m.type === 'out' ? -Number(m.amount) : Number(m.amount)).toFixed(2), m.saldo.toFixed(2)]);
    });
    const csv = '\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    const a = document.createElement('a');
    a.href = url; a.download = `${f.name.replace(/[^\w\s-]/g, '').trim()}-${todayStr()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    notice('Archivo descargado');
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab[data-tab]');
    if (tab) { go(tab.dataset.tab); return; }

    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const { act, id, mid, type, v, num: n, filter } = el.dataset;

    switch (act) {
        case 'close-dialog':  closeDialog(); break;
        case 'logros':        closeDialog(); go('logros'); break;
        case 'more':          dialogMore(); break;
        case 'fab':           funds.length ? pickFund('in') : dialogFund(); break;
        case 'save-name': {
            const v2 = ($('#uName').value || '').trim();
            v2 ? localStorage.setItem('pc-nombre', v2) : localStorage.removeItem('pc-nombre');
            saludo(); closeDialog(); notice('Ajustes guardados');
            break;
        }
        case 'tab-funds':     closeDialog(); go('funds'); break;
        case 'tab-goals':     closeDialog(); go('goals'); break;
        case 'open-fund':     movFilter = 'all'; go('fund', id); break;
        case 'open-goal':     go('goal', id); break;

        case 'new-fund':      dialogFund(); break;
        case 'edit-fund':     dialogFund(id); break;
        case 'delete-fund':   deleteFund(id); break;
        case 'export-fund':   exportFund(id); break;

        case 'quick-in':      pickFund('in'); break;
        case 'quick-out':     pickFund('out'); break;
        case 'mov':           dialogMovement(id, type); break;
        case 'transfer':      dialogTransfer(id); break;
        case 'edit-mov':      dialogEditMovement(id, mid); break;
        case 'filter':        movFilter = filter; render(); break;

        case 'save-fund':      createFund(); break;
        case 'save-fund-edit': saveFundEdit(id); break;
        case 'save-mov':       saveMovement(id, type); break;
        case 'update-mov':     updateMovement(id, mid); break;
        case 'delete-mov':     deleteMovement(id, mid); break;
        case 'save-transfer':  saveTransfer(); break;

        case 'new-goal':      dialogGoal(); break;
        case 'save-goal':     createGoal(); break;
        case 'delete-goal':   deleteGoal(id); break;
        case 'toggle-num':    toggleNum(id, Number(n)); break;
        case 'deposit':       dialogDeposit(id); break;
        case 'save-deposit':  saveDeposit(id); break;

        case 'set-amount':   $('#mAmount').value = v; $('#mAmount').focus(); break;
        case 'set-amount-d': $('#dAmount').value = v; $('#dAmount').focus(); break;
        case 'pick-color':
            $('#fColor').dataset.v = v;
            $('#fColor').querySelectorAll('[data-act="pick-color"]').forEach(b => {
                const hex = COLORS[b.dataset.v], on = b.dataset.v === v;
                b.setAttribute('aria-pressed', on);
                b.style.cssText = `background:${hex}; ${on ? 'box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px ' + hex : 'opacity:.4'}`;
            });
            break;
        case 'pick-cat':
            $('#mCat').dataset.v = v;
            $('#mCat').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
            break;
        case 'pick-type':
            $('#mType').dataset.v = type;
            $('#mType').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === type));
            break;
        case 'pick-goal-type':
            $('#gType').dataset.v = v;
            $('#gType').querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
            $('#cfg-challenge').classList.toggle('hidden', v !== 'challenge');
            $('#cfg-calendar').classList.toggle('hidden', v !== 'calendar');
            break;
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !dialogOpen) return;
    if (!e.target.closest('#dialog') || e.target.tagName === 'TEXTAREA') return;
    const primary = $('#dialog [data-primary]') || $('#dialog [data-confirm="1"]');
    if (primary) { e.preventDefault(); primary.click(); }
});

/* ---------------- Tema ---------------- */
(function theme() {
    const saved = localStorage.getItem('pc-theme');
    const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.addEventListener('click', (e) => {
        if (!e.target.closest('#theme-btn')) return;
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('pc-theme', next);
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', next === 'dark' ? '#7E1520' : '#C41E30');
    });
})();

/* ---------------- Arranque ---------------- */
function boot() {
    const b = $('#boot');
    if (!b || b.classList.contains('hidden')) return;
    b.classList.add('hidden');
    $('#app').classList.remove('hidden');
    saludo();
    const previa = localStorage.getItem('pc-visita');
    $('#last-visit').textContent = previa ? `Última visita: ${previa}` : 'Primera visita desde este dispositivo';
    localStorage.setItem('pc-visita', new Date().toLocaleString('es-HN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    $('#year').textContent = new Date().getFullYear();
    history.replaceState({ view: 'home', id: null }, '');
    render();
}

let subscribed = false;
function subscribe() {
    if (subscribed) return;
    subscribed = true;
    onSnapshot(query(collection(db, FUNDS)), (snap) => {
        funds = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        boot(); render();
    }, (err) => { boot(); notice('Sin conexión con la nube', 'neg'); console.error(err); });

    onSnapshot(query(collection(db, PLANS)), (snap) => {
        plans = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        boot(); render();
    }, (err) => { boot(); console.error(err); });
}

onAuthStateChanged(auth, () => subscribe());
signInAnonymously(auth).catch(() => { $('#boot-text').textContent = 'Trabajando sin conexión'; subscribe(); });
setTimeout(boot, 5000);

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
